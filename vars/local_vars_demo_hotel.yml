# local_vars_demo_hotel.yml — the demo box with the hospitality profile: ERPNext + Hospitality PMS
# (hotel front desk, rooms, rates, folios, housekeeping, night audit) + POS + storefront, fixed demo
# passwords (Administrator / demo1234), no certificate, no hotspot, no tailnet, no pipeline roles.
# Installed by `sudo iiab` → key (x) → hotel, or by scripts/fleet-install/demo-box.yml with PROFILE=hotel.
# Identical to local_vars_demo.yml except the business name and the extra app list below.
download_timeout: 100
iiab_admin_user: iiab-admin
iiab_admin_user_install: True
iiab_admin_can_sudo: True
iiab_admin_published_pwd: "demo1234"
admin_console_install: False
admin_console_enabled: False
iiab_home_url: /
js_menu_install: False
nodocs: True
iiab_hostname: demo
iiab_domain: lan
host_country_code: US
host_ssid: Internet in a Box
host_wifi_mode: g
host_channel: 6
hostapd_enabled: False
wifi_up_down: False
iiab_gateway_enabled: False
network_install: False
network_enabled: False
wan_ip: dhcp
wan_netmask:
wan_gateway:
wan_nameserver:
wan_try_dhcp_before_static_ip: True
ports_externally_visible: 2
ssl_install: False
