# local_vars_fleet_box.yml — a customer ERP / POS / storefront box or a shop till on a public VPS.
# local_vars_fleet_box_retail.yml: the till preset PLUS the retail line (D-013). Same placeholders.
# Installed by `sudo iiab` → key (b), which fills the placeholders (the box id from
# `fleet onboard`, the business name, the public domain already pointing at this machine,
# the certificate contact address, two generated passwords). IIAB base + ERPNext with the
# fork's apps (HR, CRM, builder, payments, webshop, POS Next) behind a Let's Encrypt
# certificate, Tailscale for the private side. No hotspot, no pipeline roles.
download_timeout: 100

iiab_admin_user: iiab-admin
iiab_admin_user_install: True
iiab_admin_can_sudo: True
iiab_admin_published_pwd: "__ADMIN_PW__"
admin_console_install: False
admin_console_enabled: False
iiab_home_url: /
js_menu_install: False
nodocs: True

iiab_hostname: __BOX_ID__
iiab_domain: lan
host_country_code: US
host_ssid: Internet in a Box
host_wifi_mode: g
host_channel: 6
hostapd_enabled: False
wifi_up_down: False
iiab_gateway_enabled: False
wan_ip: dhcp
wan_netmask:
wan_gateway:
wan_nameserver:
wan_try_dhcp_before_static_ip: True
ports_externally_visible: 2

ssl_install: True
ssl_enabled: True
iiab_ssl_enabled: True
iiab_ssl_domain: "__DOMAIN__"
iiab_ssl_certbot_email: "__CERTBOT_EMAIL__"
dns_jail_enabled: False
sshd_install: True
sshd_enabled: True
remoteit_install: False
remoteit_enabled: False
tailscale_install: True
tailscale_enabled: True
squid_install: False
squid_enabled: False
gw_squid_whitelist: False
gw_block_https: False
bluetooth_install: False
bluetooth_enabled: False
bluetooth_term_enabled: False
usb_lib_writable_sticks: False
cups_install: False
cups_enabled: False
samba_install: False
samba_enabled: False
nginx_high_php_limits: False
allow_www_data_poweroff: False

postgresql_install: False
postgresql_enabled: False

gitea_install: False
gitea_enabled: False
jupyterhub_install: False
jupyterhub_enabled: False
lokole_install: False
lokole_enabled: False
mediawiki_install: False
mediawiki_enabled: False
mosquitto_install: False
mosquitto_enabled: False
nodered_install: False
nodered_enabled: False
nextcloud_install: False
nextcloud_enabled: False
wordpress_install: False
wordpress_enabled: False
kolibri_install: False
kolibri_enabled: False
kiwix_install: False
kiwix_enabled: False
moodle_install: False
moodle_enabled: False
osm_vector_maps_install: False
osm_vector_maps_enabled: False
maps_install: False
maps_enabled: False
sugarizer_install: False
sugarizer_enabled: False
transmission_install: False
transmission_enabled: False
awstats_install: False
awstats_enabled: False
matomo_install: False
matomo_enabled: False
monit_install: False
monit_enabled: False
munin_install: False
munin_enabled: False
phpmyadmin_install: False
phpmyadmin_enabled: False
vnstat_install: False
vnstat_enabled: False
azuracast_install: False
azuracast_enabled: False
captiveportal_install: False
captiveportal_enabled: False
internetarchive_install: False
internetarchive_enabled: False
luanti_install: False
luanti_enabled: False
calibreweb_install: False
calibreweb_enabled: False
calibre_install: False
calibre_enabled: False
code_install: False
code_enabled: False
pbx_install: False
pbx_enabled: False

erpnext_install: True
erpnext_enabled: True
erpnext_admin_password: "__ERP_ADMIN_PW__"
erpnext_db_password: "__ERP_DB_PW__"      # the site database password; generated by the installer with the two above
erpnext_business_name: "__BUSINESS__"

rapidpro_install: False
rapidpro_enabled: False
rapidpro_aws_enabled: False
# The retail line (D-013): the shop's own WhatsApp number answers its bound numbers from this box.
# The bridge, the gateway in its retail profile and the router; no flow engine, no Postgres, no
# cockpit; the model is optional (set ai_gateway_anthropic_api_key or _gemini_api_key to add it).
wuzapi_install: True
wuzapi_enabled: True
ai_gateway_install: True
ai_gateway_enabled: True
ai_gateway_profile: retail
ai_gateway_postgres_uri: ""
ai_gateway_default_persona: shop
ai_gateway_admin_phone: ""
ai_gateway_authorized_users: ""
ai_gateway_jobs: {}
ai_gateway_retail_line_name: "__BUSINESS__"
ai_gateway_api_key: "{{ lookup('password', iiab_etc_path ~ '/ai_gateway_api_key chars=ascii_letters,digits length=40') }}"
ai_gateway_wuzapi_token: "{{ lookup('password', iiab_etc_path ~ '/wuzapi_line_token chars=ascii_letters,digits length=32') }}"
rivebot_install: True
rivebot_enabled: True
rivebot_gateway_internal_key: "{{ lookup('password', iiab_etc_path ~ '/gateway_internal_key chars=ascii_letters,digits length=40') }}"
siyuan_install: False
siyuan_enabled: False
organized_install: False
organized_enabled: False
anki_install: False
anki_enabled: False
email_bridge_install: False
email_bridge_enabled: False
