---
- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Install email-bridge system dependencies
  ansible.builtin.apt:
    name:
      - curl
    state: present
  become: true

# ── Auto-provision the RapidPro External (mailto) channel ────────────────────
# Best-effort: when no channel UUID is pinned and RapidPro + a bot address are
# present, get-or-create the channel and capture its UUID for the .env. Soft —
# if RapidPro isn't ready the bridge still installs and you can create it later
# (manually or on the next run); inbound polling stays off until the UUID is set.
# Runs before the tree is written because the UUID goes into the environment file.
- name: Check whether RapidPro is available for channel auto-provisioning
  ansible.builtin.stat:
    path: "{{ email_bridge_rapidpro_dir }}/.venv/bin/python"
  register: email_bridge_rp_python
  when: email_bridge_channel_uuid | length == 0

- name: Get-or-create the RapidPro External (mailto) channel
  ansible.builtin.command:
    cmd: >-
      {{ email_bridge_rapidpro_dir }}/.venv/bin/python manage.py shell
      -c "exec(open('{{ role_path }}/files/create_email_channel.py').read())"
    chdir: "{{ email_bridge_rapidpro_dir }}"
  environment:
    EMAIL_BOT_ADDR: "{{ email_bridge_from }}"
    EMAIL_SEND_URL: "http://localhost:{{ email_bridge_port }}/send"
    EMAIL_SEND_AUTH: "{{ email_bridge_send_auth }}"
    EMAIL_MAX_LENGTH: "{{ email_bridge_max_body | string }}"
  become: true
  become_user: "{{ email_bridge_user }}"
  register: email_bridge_channel_out
  changed_when: "'CHANNEL CREATED' in (email_bridge_channel_out.stdout | default(''))"
  failed_when: false
  when:
    - email_bridge_channel_uuid | length == 0
    - email_bridge_from | length > 0
    - email_bridge_rp_python.stat.exists | default(false)

- name: Capture the channel UUID for the .env
  ansible.builtin.set_fact:
    email_bridge_channel_uuid: "{{ email_bridge_channel_out.stdout | regex_findall('UUID=([0-9a-f-]+)') | first }}"
  when:
    - email_bridge_channel_uuid | length == 0
    - email_bridge_channel_out is defined
    - email_bridge_channel_out.stdout is defined
    - "'UUID=' in email_bridge_channel_out.stdout"

- name: Install the tree, venv, environment file and unit of the email bridge (roles/uv-service)
  ansible.builtin.include_role:
    name: uv-service
  vars:
    uv_service: "{{ email_bridge_service }}"

- name: Check for the auto-generated send-auth token file
  ansible.builtin.stat:
    path: "{{ iiab_etc_path }}/email_bridge_send_auth.token"
  register: email_bridge_token_file

- name: Secure the auto-generated send-auth token file (0600)
  ansible.builtin.file:
    path: "{{ iiab_etc_path }}/email_bridge_send_auth.token"
    mode: "0600"
  become: true
  when: email_bridge_token_file.stat.exists   # the service writes it on first start

# Failure alerting: any unit carrying `OnFailure=notify-failure@%n.service`
# emails the operator through this bridge when it enters failed state.
# Owned by this role because the bridge is the delivery path.
- name: Install notify-failure alert script
  ansible.builtin.copy:
    src: notify-failure
    dest: /usr/local/sbin/notify-failure
    mode: "0755"
  become: true

- name: Install notify-failure@ template unit
  ansible.builtin.copy:
    src: notify-failure@.service
    dest: /etc/systemd/system/notify-failure@.service
    mode: "0644"
  become: true

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add email_bridge_disk_usage to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: email-bridge
    option: email_bridge_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'email_bridge_installed: True'"
  ansible.builtin.set_fact:
    email_bridge_installed: true

- name: "Add 'email_bridge_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^email_bridge_installed"
    line: "email_bridge_installed: True"
