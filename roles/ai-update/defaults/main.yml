---
ai_update_install: True
ai_update_enabled: True

# uv binary
ai_update_uv_bin: /usr/local/bin/uv

# ── Where the services come from ───────────────────────────────────
# Their sources, versions, directories and release tags are defined ONCE, in
# their own roles' defaults: roles/ai-gateway and roles/rivebot (this role runs
# their update entries), roles/rapidpro (rapidpro_repo, rapidpro_dir, the
# courier and mailroom checkouts, rapidpro_*_release and *_binary_url) and
# roles/wuzapi (wuzapi_repo, wuzapi_src_dir, wuzapi_release, wuzapi_binary_url).
# main.yml loads the rapidpro and wuzapi defaults at its start (tasks/load-role-defaults.yml)
# without outranking the operator's values.

# ── Go toolchain for the fallback build (when a release download fails) ──
ai_update_go_bin: /usr/local/go/bin/go

# ── Skip list (set via -e to skip specific components) ─────────────
# Usage: ./runrole ai-update -e '{"ai_update_skip": ["wuzapi", "rapidpro"]}'
# Names: ai-gateway (with its libraries), rivebot, rapidpro, courier, mailroom, wuzapi
ai_update_skip: []
