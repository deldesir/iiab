---
# ai-update: Update the entire cognitive pipeline in one shot.
# No install-once guard. No boolean assertions. Just update.
#
# Usage:
#   ./runrole ai-update
#   ./runrole ai-update -e '{"ai_update_skip": ["wuzapi"]}'

- name: Install, then enable or disable the AI stack update
  block:
    # ═══════════════════════════════════════════════════════════════
    # STAGE 0: Ensure git safe.directory for all repos
    # ═══════════════════════════════════════════════════════════════
    # Repos are owned by iiab-admin but Ansible runs as root.
    # The git module fails on dubious ownership before we can pull.

    - name: The flow engine's and the bridge's variables, from their roles' defaults (one source for sources, versions and releases)
      ansible.builtin.include_tasks: load-role-defaults.yml
      loop: [rapidpro, wuzapi]
      loop_control:
        loop_var: role_defaults_of

    - name: "Add missing dirs to git safe.directory"
      community.general.git_config:
        scope: global
        name: safe.directory
        value: "{{ item }}"
        add_mode: add
      environment:
        HOME: "{{ lookup('env', 'HOME') | default('/root', true) }}" # timers and transient units have no HOME
      become: true
      loop:
        - "{{ rapidpro_dir }}"
        - "{{ wuzapi_src_dir }}"

    # ═══════════════════════════════════════════════════════════════
    # STAGE 1: The uv services, through their own update entries
    # ═══════════════════════════════════════════════════════════════
    # Each entry moves the tree (and the gateway's libraries) to the version
    # its role defines, re-syncs the venv, re-applies the role's patches and
    # restarts the service when anything changed.

    - name: Move the AI Gateway and its libraries to their wanted versions (roles/ai-gateway, update entry)
      ansible.builtin.include_role:
        name: ai-gateway
        tasks_from: update
      when: "'ai-gateway' not in ai_update_skip"

    - name: Move RiveBot to its wanted version (roles/rivebot, update entry)
      ansible.builtin.include_role:
        name: rivebot
        tasks_from: update
      when: "'rivebot' not in ai_update_skip"

    # ═══════════════════════════════════════════════════════════════
    # STAGE 1b: Pull the other git repos
    # ═══════════════════════════════════════════════════════════════

    # 1c. RapidPro
    - name: "Pull RapidPro"
      ansible.builtin.git:
        repo: "{{ rapidpro_repo }}"
        dest: "{{ rapidpro_dir }}"
        version: "{{ rapidpro_version }}"
        force: true
        update: true
      become: true
      when: "'rapidpro' not in ai_update_skip"
      register: rapidpro_git_result

    # 1d. WuzAPI source (static assets)
    - name: "Pull WuzAPI source (static assets)"
      ansible.builtin.git:
        repo: "{{ wuzapi_repo }}"
        dest: "{{ wuzapi_src_dir }}"
        version: main
        force: true
        update: true
      become: true
      when: "'wuzapi' not in ai_update_skip"
      register: wuzapi_src_result

    # 1e. Courier (Go source for local build)
    - name: "Pull Courier source"
      ansible.builtin.git:
        repo: "{{ rapidpro_courier_repo }}"
        dest: "{{ rapidpro_courier_src_dir }}"
        version: "{{ rapidpro_courier_version }}"
        force: true
        update: true
      become: true
      when: "'courier' not in ai_update_skip"
      register: courier_git_result

    # 1f. Mailroom (Go source for local build)
    - name: "Pull Mailroom source"
      ansible.builtin.git:
        repo: "{{ rapidpro_mailroom_repo }}"
        dest: "{{ rapidpro_mailroom_src_dir }}"
        version: "{{ rapidpro_mailroom_version }}"
        force: true
        update: true
      become: true
      when: "'mailroom' not in ai_update_skip"
      register: mailroom_git_result

    # ═══════════════════════════════════════════════════════════════
    # STAGE 2: Go binaries — download release, build only if needed
    # ═══════════════════════════════════════════════════════════════
    # Strategy: try pre-built release binaries first (seconds).
    # Fall back to local Go compilation only when the download fails
    # (e.g. fork has commits newer than the latest GitHub release).

    # ── 2a. Courier (gzip-preferred download, raw fallback, source build last) ──
    # Prefer the gzipped release asset (much smaller download); fall back to the
    # raw binary if no .gz exists, then to a local source build if both fail.
    - name: "Install courier binary (gz-preferred, checksum-verified)"
      ansible.builtin.command: bash /opt/iiab/iiab/scripts/install-release-binary.sh "{{ rapidpro_courier_binary_url }}" "{{ rapidpro_courier_bin }}"
      become: true
      when:
        - "'courier' not in ai_update_skip"
        - courier_git_result.changed | default(false)
      register: courier_download_result
      failed_when: false
      changed_when: "'installed' in courier_download_result.stdout"

    - name: "Build courier from source (fallback)"
      ansible.builtin.shell: >
        {{ ai_update_go_bin }} build -ldflags="-s -w"
        -o {{ rapidpro_courier_bin }}
        ./cmd/courier
      args:
        chdir: "{{ rapidpro_courier_src_dir }}"
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: "{{ rapidpro_go_arch }}"
      become: true
      when:
        - "'courier' not in ai_update_skip"
        - courier_git_result.changed | default(false)
        - courier_download_result.rc | default(1) != 0
      register: courier_build_result
      changed_when: true   # runs only after a code change when the release download failed

    - name: "⚙️  courier: {{ 'downloaded release' if (courier_download_result.rc | default(1) == 0) else 'built from source' }}"
      ansible.builtin.debug:
        msg: "courier binary updated"
      when: courier_git_result.changed | default(false)
      changed_when: true

    # ── 2b. Mailroom (gzip-preferred download, raw fallback, source build last) ──
    - name: "Install mailroom binary (gz-preferred, checksum-verified)"
      ansible.builtin.command: bash /opt/iiab/iiab/scripts/install-release-binary.sh "{{ rapidpro_mailroom_binary_url }}" "{{ rapidpro_mailroom_bin }}"
      become: true
      when:
        - "'mailroom' not in ai_update_skip"
        - mailroom_git_result.changed | default(false)
      register: mailroom_download_result
      failed_when: false
      changed_when: "'installed' in mailroom_download_result.stdout"

    - name: "Build mailroom from source (fallback)"
      ansible.builtin.shell: >
        {{ ai_update_go_bin }} build -ldflags="-s -w"
        -o {{ rapidpro_mailroom_bin }}
        ./cmd/mailroom
      args:
        chdir: "{{ rapidpro_mailroom_src_dir }}"
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: "{{ rapidpro_go_arch }}"
      become: true
      when:
        - "'mailroom' not in ai_update_skip"
        - mailroom_git_result.changed | default(false)
        - mailroom_download_result.rc | default(1) != 0
      register: mailroom_build_result
      changed_when: true   # same

    - name: "⚙️  mailroom: {{ 'downloaded release' if (mailroom_download_result.rc | default(1) == 0) else 'built from source' }}"
      ansible.builtin.debug:
        msg: "mailroom binary updated"
      when: mailroom_git_result.changed | default(false)
      changed_when: true

    # ── 2c. WuzAPI (gzip-preferred download, raw fallback) ───────
    - name: "Install WuzAPI binary (gz-preferred, checksum-verified)"
      ansible.builtin.command: bash /opt/iiab/iiab/scripts/install-release-binary.sh "{{ wuzapi_binary_url }}" "{{ wuzapi_dir }}/wuzapi"
      become: true
      when: "'wuzapi' not in ai_update_skip"
      register: wuzapi_binary_result
      changed_when: "'installed' in wuzapi_binary_result.stdout"

    # ═══════════════════════════════════════════════════════════════
    # STAGE 3: Apply patches + resolve dependencies
    # ═══════════════════════════════════════════════════════════════

    # 3a. IIAB local patch on the flow engine (the gateway's library patches live in its role)
    - name: Apply the IIAB local patch on the flow engine
      ansible.builtin.include_tasks: apply-patches.yml

    # 3e. RapidPro post-update (configure + migrate + collectstatic + patches)
    - name: RapidPro post-update
      ansible.builtin.include_tasks: rapidpro-post-update.yml
      when: rapidpro_git_result.changed | default(false)

    # 3f. WuzAPI static assets
    - name: Copy updated WuzAPI static assets
      ansible.builtin.copy:
        mode: preserve
        src: "{{ wuzapi_src_dir }}/static"
        dest: "{{ wuzapi_dir }}/"
        remote_src: true
        owner: "{{ ai_update_gateway_user }}"
        group: "{{ ai_update_gateway_user }}"
      become: true
      when: wuzapi_src_result.changed | default(false)

    # ═══════════════════════════════════════════════════════════════
    # STAGE 5: Harden permissions (ALWAYS runs)
    # ═══════════════════════════════════════════════════════════════
    # These run unconditionally because ANY stage (git pull, chown,
    # uv sync, collectstatic) can tighten directory permissions that
    # nginx (www-data) needs.

    - name: "Fix RapidPro permissions for nginx"
      ansible.builtin.shell: |
        chmod -R a+rX {{ rapidpro_dir }}/sitestatic {{ rapidpro_dir }}/media 2>/dev/null || true
        chmod 755 {{ rapidpro_dir }}/run 2>/dev/null || true
      become: true
      changed_when: false
      when: "'rapidpro' not in ai_update_skip"

    - name: "Clean stale DynamoDB/ES spool files (local-first mode)"
      ansible.builtin.shell: rm -f {{ rapidpro_dir }}/spool/*/dynamo/*.jsonl {{ rapidpro_dir }}/spool/*/elastic/*.jsonl
      become: true
      changed_when: false
      when:
        - "'rapidpro' not in ai_update_skip"
        - not (rapidpro_aws_enabled | default(false))

    # ═══════════════════════════════════════════════════════════════
    # STAGE 6: Grouped restarts (the uv services restarted in stage 1)
    # ═══════════════════════════════════════════════════════════════

    - name: Restart RapidPro services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      become: true
      loop:
        - rapidpro-gunicorn
        - rapidpro-celery
      when: rapidpro_git_result.changed | default(false)

    - name: Restart courier
      ansible.builtin.systemd:
        name: rapidpro-courier
        state: restarted
      become: true
      when: courier_git_result.changed | default(false)

    - name: Restart mailroom
      ansible.builtin.systemd:
        name: rapidpro-mailroom
        state: restarted
      become: true
      when: mailroom_git_result.changed | default(false)

    - name: Restart wuzapi
      ansible.builtin.systemd:
        name: wuzapi
        state: restarted
      become: true
      when: wuzapi_binary_result.changed | default(false)

    # ═══════════════════════════════════════════════════════════════
    # STAGE 7: Register in iiab.ini + Report
    # ═══════════════════════════════════════════════════════════════

    - name: Add 'ai_update' variable values to {{ iiab_ini_file }}
      community.general.ini_file:
        mode: "0644"
        path: "{{ iiab_ini_file }}"
        section: ai-update
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: AI Update
        - option: description
          value: '"Unified update role for the cognitive pipeline"'
        - option: ai_update_install
          value: "{{ ai_update_install }}"
        - option: ai_update_enabled
          value: "{{ ai_update_enabled }}"
        - option: ai_update_last_run
          value: "{{ lookup('pipe', 'date --iso-8601=seconds') }}"
        - option: ai_update_skipped
          value: "{{ ai_update_skip | join(',') or 'none' }}"

    - name: Update complete
      ansible.builtin.debug:
        msg: "Cognitive pipeline updated. All changed services restarted."

  rescue:
    - name: "UPDATE FAILED — SEE ERROR ABOVE"
      ansible.builtin.fail:
        msg: "Pipeline update failed. Check the error above. Some services may need manual restart."
