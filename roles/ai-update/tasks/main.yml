---
# ai-update: Update the entire cognitive pipeline in one shot.
# No install-once guard. No boolean assertions. Just update.
#
# Usage:
#   ./runrole ai-update
#   ./runrole ai-update -e '{"ai_update_skip": ["wuzapi"]}'

- name: Install, then enable or disable the AI stack update
  block:
    # The stages, each its own file; they share their registered results (a pull's change
    # decides the binary install and the restart). One failure anywhere lands in the rescue.
    - name: Stage 0 - the roles' variables and git's safe.directory entries
      ansible.builtin.include_tasks: prepare.yml
    - name: Stage 1 - the uv services' update entries, the other repositories pulled
      ansible.builtin.include_tasks: pull.yml
    - name: Stage 2 - the Go services' release binaries
      ansible.builtin.include_tasks: binaries.yml
    - name: Stage 3 - patches, post-update steps, static assets, permissions, spool
      ansible.builtin.include_tasks: apply.yml
    - name: Stage 4 - restart what changed
      ansible.builtin.include_tasks: restart.yml
    - name: Stage 5 - the run recorded
      ansible.builtin.include_tasks: record.yml
  rescue:
    - name: "UPDATE FAILED — SEE ERROR ABOVE"
      ansible.builtin.fail:
        msg: "Pipeline update failed. Check the error above. Some services may need manual restart."
