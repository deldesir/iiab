---
# Load another role's defaults into this play without outranking the operator's values.
# include_vars outranks local_vars.yml, so loading a defaults file as it is would blank every
# operator value whose default is empty. So: remember every value of those names that is already
# defined, load the defaults (lazily, they reference each other), then put the remembered values
# back with set_fact, which outranks include_vars. Called with role_defaults_of = the role's name.

- name: Remember the variables already defined (local_vars, default_vars) for the role {{ role_defaults_of }}
  ansible.builtin.set_fact:
    _defined_vars: "{{ _defined_vars | default({}) | combine({item: lookup('vars', item)}) }}"
  loop: "{{ (lookup('file', role_path ~ '/../' ~ role_defaults_of ~ '/defaults/main.yml') | from_yaml).keys() | list }}"
  when: lookup('vars', item, default='__undefined__') != '__undefined__'
  no_log: true

- name: Load the defaults of the role {{ role_defaults_of }}
  ansible.builtin.include_vars: "{{ role_path }}/../{{ role_defaults_of }}/defaults/main.yml"

- name: Put the already-defined values back on top of the role defaults
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _defined_vars | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Forget the remembered values, so the next role's load starts clean
  ansible.builtin.set_fact:
    _defined_vars: {}
