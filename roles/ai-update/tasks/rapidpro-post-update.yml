---
# RapidPro post-update: backup DB, run migrations, collectstatic, re-patch URLs.
#
# settings.py is NOT re-rendered here (it carries device-local values and only
# changes with local_vars.yml - run the rapidpro role with --tags settings for
# that). settings_common.py is tracked in the fork and arrives with the code.

- name: Ensure PostgreSQL is running before RapidPro update
  ansible.builtin.systemd:
    name: postgresql-iiab
    state: started
  become: true

- name: Backup RapidPro database before migration (a failed dump stops the update, migrate never runs without one)
  ansible.builtin.shell: sudo -u postgres pg_dump -Fc temba > /var/backups/temba-pre-update-$(date +%Y%m%d%H%M).dump
  become: true
  changed_when: true

- name: Fix RapidPro ownership after git pull
  ansible.builtin.command: "chown -R {{ ai_update_gateway_user }}:{{ ai_update_gateway_user }} {{ rapidpro_dir }}"
  become: true
  changed_when: false

- name: Ensure pgvector for the knowledge app
  ansible.builtin.include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/pgvector.yml
- name: Ensure bun for the components build
  ansible.builtin.include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/bun.yml
- name: Strip legacy Django email settings superseded by MAILERS from settings.py
  ansible.builtin.lineinfile:
    path: "{{ rapidpro_dir }}/temba/settings.py"
    regexp: "^\\s*EMAIL_(BACKEND|HOST|PORT|HOST_USER|HOST_PASSWORD|USE_TLS|USE_SSL|TIMEOUT|SSL_KEYFILE|SSL_CERTFILE)\\s*="
    state: absent
  become: true

- name: Sync RapidPro Python dependencies
  ansible.builtin.shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv sync
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ ai_update_gateway_user }}"
  register: rapidpro_sync
  changed_when: "'Installed' in rapidpro_sync.stderr or 'Uninstalled' in rapidpro_sync.stderr"

- name: Run database migrations
  ansible.builtin.shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py migrate
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ ai_update_gateway_user }}"
  register: rapidpro_migrate
  changed_when: "'No migrations to apply' not in rapidpro_migrate.stdout"

- name: Create the Postgres search indexes
  ansible.builtin.shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py nanorp_indexes
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ ai_update_gateway_user }}"
  when: not (rapidpro_aws_enabled | default(false))
  changed_when: true   # creates what is missing; the command does not report which

- name: Collect static files
  ansible.builtin.shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py collectstatic --noinput
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ ai_update_gateway_user }}"
  register: rapidpro_collectstatic
  changed_when: "'0 static files copied' not in rapidpro_collectstatic.stdout"

- name: Remove the retired front-end URL patch script
  ansible.builtin.file:
    path: /usr/local/sbin/rapidpro-patch-frontend-urls
    state: absent
  become: true

- name: Purge Django cache
  ansible.builtin.shell: |
    {{ rapidpro_dir }}/.venv/bin/python manage.py shell -c "from django.core.cache import cache; cache.clear()"
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  failed_when: false   # best effort: a cache that cannot be reached is rebuilt on the next request
  changed_when: true   # always purges

# RedBeat keeps beat entries in valkey after they leave CELERY_BEAT_SCHEDULE, so a
# task upstream removed would keep firing as "unregistered". Prune against the
# freshly rendered settings (idempotent; internal redbeat:: keys untouched).
- name: Prune RedBeat schedule entries no longer in CELERY_BEAT_SCHEDULE
  ansible.builtin.shell: |
    {{ rapidpro_dir }}/.venv/bin/python manage.py shell -c "$(cat /opt/iiab/iiab/roles/ai-update/files/prune_redbeat_entries.py)"
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  register: redbeat_prune
  changed_when: "'pruned 0 ' not in redbeat_prune.stdout"   # a prune that fails stops the update: the schedule would keep firing removed tasks

# The run directory is not touched here: the flow engine role creates it 0770 with the web
# server's group (units.yml), and a 755 after every update used to undo that.
- name: Which of the static directories exist
  ansible.builtin.stat:
    path: "{{ rapidpro_dir }}/{{ item }}"
  loop: [sitestatic, media]
  register: rapidpro_static_dirs

- name: Give nginx read and traverse rights on the static directories
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: a+rX
    recurse: true
    state: directory
  loop: "{{ rapidpro_static_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  become: true
