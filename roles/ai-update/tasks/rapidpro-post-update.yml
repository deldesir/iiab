---
# RapidPro post-update: backup DB, run migrations, collectstatic, re-patch URLs.
#
# settings.py and url_tags.py are NOT re-deployed here (they carry
# device-local drift and only change with local_vars.yml). settings_common.py
# IS re-rendered: since v26.3.48 its content tracks the upstream version
# (INSTALLED_APPS, celery scheduler, staticfiles finders), so new code needs
# the current template.

- name: Ensure PostgreSQL is running before RapidPro update
  systemd:
    name: postgresql-iiab
    state: started
  become: yes

- name: Backup RapidPro database before migration
  shell: sudo -u postgres pg_dump -Fc temba > /var/backups/temba-pre-update-$(date +%Y%m%d%H%M).dump
  become: yes
  ignore_errors: yes

- name: Fix RapidPro ownership after git pull
  command: "chown -R {{ ai_update_gateway_user }}:{{ ai_update_gateway_user }} {{ ai_update_rapidpro_dir }}"
  become: yes
  changed_when: false

- name: Load rapidpro role defaults (settings template + pgvector vars)
  include_vars: /opt/iiab/iiab/roles/rapidpro/defaults/main.yml

- name: Ensure pgvector for the knowledge app
  include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/pgvector.yml

- name: Ensure bun for the components build
  include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/bun.yml

- name: Re-render RapidPro common settings from the current template
  template:
    src: /opt/iiab/iiab/roles/rapidpro/templates/settings_common.py.j2
    dest: "{{ ai_update_rapidpro_dir }}/temba/settings_common.py"
    owner: "{{ ai_update_gateway_user }}"
    group: "{{ ai_update_gateway_user }}"
    mode: '0600'
  become: yes

- name: Sync RapidPro Python dependencies
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv sync
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Run database migrations
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py migrate
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Collect static files
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py collectstatic --noinput
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Execute frontend patch script
  command: python3 {{ ai_update_rapidpro_dir }}/patch_urls.py
  become_user: "{{ ai_update_gateway_user }}"
  become: yes
  ignore_errors: yes

- name: Purge Django cache
  shell: |
    {{ ai_update_rapidpro_dir }}/.venv/bin/python manage.py shell -c "from django.core.cache import cache; cache.clear()"
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  ignore_errors: yes

- name: Fix Nginx permissions on static assets and socket directory
  shell: |
    chmod -R a+rX {{ ai_update_rapidpro_dir }}/sitestatic {{ ai_update_rapidpro_dir }}/media
    chmod 755 {{ ai_update_rapidpro_dir }}/run
  become: yes
  ignore_errors: yes
