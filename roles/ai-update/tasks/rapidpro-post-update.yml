---
# RapidPro post-update: backup DB, run migrations, collectstatic, re-patch URLs.
#
# settings.py is NOT re-rendered here (it carries device-local values and only
# changes with local_vars.yml - run the rapidpro role with --tags settings for
# that). settings_common.py is tracked in the fork and arrives with the code.

- name: Ensure PostgreSQL is running before RapidPro update
  systemd:
    name: postgresql-iiab
    state: started
  become: yes

- name: Backup RapidPro database before migration
  shell: sudo -u postgres pg_dump -Fc temba > /var/backups/temba-pre-update-$(date +%Y%m%d%H%M).dump
  become: yes
  ignore_errors: yes

- name: Fix RapidPro ownership after git pull
  command: "chown -R {{ ai_update_gateway_user }}:{{ ai_update_gateway_user }} {{ ai_update_rapidpro_dir }}"
  become: yes
  changed_when: false

# The pgvector/bun tasks need the rapidpro role's defaults, but include_vars
# OUTRANKS local_vars.yml: loading the defaults file would blank every operator
# value whose default is "".
# So: remember every value that is already defined, load the defaults (lazily,
# they reference each other), then put the remembered values back with
# set_fact, which outranks include_vars.
- name: Remember rapidpro variables that are already defined (local_vars, default_vars)
  set_fact:
    _rapidpro_defined_vars: "{{ _rapidpro_defined_vars | default({}) | combine({item: lookup('vars', item)}) }}"
  loop: "{{ (lookup('file', '/opt/iiab/iiab/roles/rapidpro/defaults/main.yml') | from_yaml).keys() | list }}"
  when: lookup('vars', item, default='__undefined__') != '__undefined__'
  no_log: true

- name: Load rapidpro role defaults (pgvector + bun vars)
  include_vars: /opt/iiab/iiab/roles/rapidpro/defaults/main.yml

- name: Put the already-defined values back on top of the role defaults
  set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _rapidpro_defined_vars | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Ensure pgvector for the knowledge app
  include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/pgvector.yml

- name: Ensure bun for the components build
  include_tasks: /opt/iiab/iiab/roles/rapidpro/tasks/bun.yml

# Django 6.1 (RapidPro v26.3.55+) refuses to boot when the legacy EMAIL_* settings
# coexist with the MAILERS dict that settings_common.py now defines. settings.py is
# device-local and never re-rendered here, but older renders wrote
# `EMAIL_BACKEND = ...` into it — strip any legacy email setting idempotently.
- name: Strip legacy Django email settings superseded by MAILERS from settings.py
  lineinfile:
    path: "{{ ai_update_rapidpro_dir }}/temba/settings.py"
    regexp: '^\s*EMAIL_(BACKEND|HOST|PORT|HOST_USER|HOST_PASSWORD|USE_TLS|USE_SSL|TIMEOUT|SSL_KEYFILE|SSL_CERTFILE)\s*='
    state: absent
  become: yes

- name: Sync RapidPro Python dependencies
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv sync
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Run database migrations
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py migrate
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Create the Postgres search indexes
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py nanorp_indexes
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"
  when: not (rapidpro_aws_enabled | default(false))

- name: Collect static files
  shell: |
    export PATH="/home/{{ ai_update_gateway_user }}/.local/bin:$PATH"
    uv run python manage.py collectstatic --noinput
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  become_user: "{{ ai_update_gateway_user }}"

- name: Remove the retired front-end URL patch script
  file:
    path: /usr/local/sbin/rapidpro-patch-frontend-urls
    state: absent
  become: yes

- name: Purge Django cache
  shell: |
    {{ ai_update_rapidpro_dir }}/.venv/bin/python manage.py shell -c "from django.core.cache import cache; cache.clear()"
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  ignore_errors: yes

# RedBeat keeps beat entries in valkey after they leave CELERY_BEAT_SCHEDULE, so a
# task upstream removed would keep firing as "unregistered". Prune against the
# freshly rendered settings (idempotent; internal redbeat:: keys untouched).
- name: Prune RedBeat schedule entries no longer in CELERY_BEAT_SCHEDULE
  shell: |
    {{ ai_update_rapidpro_dir }}/.venv/bin/python manage.py shell -c "$(cat /opt/iiab/iiab/roles/ai-update/files/prune_redbeat_entries.py)"
  args:
    chdir: "{{ ai_update_rapidpro_dir }}"
  become: yes
  ignore_errors: yes

- name: Fix Nginx permissions on static assets and socket directory
  shell: |
    chmod -R a+rX {{ ai_update_rapidpro_dir }}/sitestatic {{ ai_update_rapidpro_dir }}/media
    chmod 755 {{ ai_update_rapidpro_dir }}/run
  become: yes
  ignore_errors: yes
