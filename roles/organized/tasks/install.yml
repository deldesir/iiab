---
- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Mark organized-backend directory as safe for git
  community.general.git_config:
    scope: global
    name: safe.directory
    value: "{{ organized_dir }}"
    add_mode: add

- name: Clone organized-backend repository
  ansible.builtin.git:
    repo: "{{ organized_repo }}"
    dest: "{{ organized_dir }}"
    version: "{{ organized_version }}"
    depth: 1
    force: true

- name: Mark organized-app directory as safe for git
  community.general.git_config:
    scope: global
    name: safe.directory
    value: "{{ organized_app_dir }}"
    add_mode: add

- name: Clone organized-app repository
  ansible.builtin.git:
    repo: "{{ organized_app_repo }}"
    dest: "{{ organized_app_dir }}"
    version: "{{ organized_app_version }}"
    depth: 1
    force: true
  register: organized_app_src

- name: Install organized-app npm dependencies
  ansible.builtin.command: npm ci --prefer-offline
  args:
    chdir: "{{ organized_app_dir }}"
  environment:
    NODE_OPTIONS: "--max-old-space-size=2048"
  changed_when: true   # npm ci always rebuilds node_modules

- name: Inject offline build-time env for organized-app (Vite .env.production.local)
  ansible.builtin.template:
    src: organized.env.production.local.j2
    dest: "{{ organized_app_dir }}/.env.production.local"
    mode: "0644"
  register: organized_build_env

- name: Force a frontend rebuild when the source or build env changed
  # `npm run build` below is guarded by `creates: dist/index.html`, so it only
  # runs when dist is absent. Removing dist here whenever the cloned app source
  # OR the injected build env changed makes the build idempotent: a new fork
  # commit (or env edit) is always rebuilt, while an unchanged run is a no-op.
  ansible.builtin.file:
    path: "{{ organized_app_dir }}/dist"
    state: absent
  when: organized_app_src is changed or organized_build_env is changed

- name: Build organized-app frontend (Vite)
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ organized_app_dir }}"
    creates: "{{ organized_app_dir }}/dist/index.html"
  environment:
    NODE_OPTIONS: "--max-old-space-size=2048"

- name: Create backend virtualenv with uv
  ansible.builtin.command: /root/.local/bin/uv venv --python /usr/bin/python3 .venv
  args:
    chdir: "{{ organized_dir }}"
    creates: "{{ organized_dir }}/.venv"

- name: Install backend dependencies with uv
  ansible.builtin.command: /root/.local/bin/uv pip install -r requirements.txt
  args:
    chdir: "{{ organized_dir }}"
  environment:
    VIRTUAL_ENV: "{{ organized_dir }}/.venv"
  ignore_errors: true
  register: organized_pip
  changed_when: "'Installed' in organized_pip.stderr"

- name: Install postgresql-client
  ansible.builtin.apt:
    name: postgresql-client
    state: present
  become: true

# --- System user & directories ---

- name: Create organized system user
  ansible.builtin.user:
    name: "{{ organized_user }}"
    system: true
    home: "{{ organized_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
  become: true

- name: Create log directory
  ansible.builtin.file:
    path: /var/log/organized
    state: directory
    owner: "{{ organized_user }}"
    group: "{{ organized_user }}"
    mode: "0755"
  become: true

- name: Install logrotate config for organized logs
  ansible.builtin.template:
    src: organized.logrotate.j2
    dest: /etc/logrotate.d/organized
    mode: "0644"
  become: true

- name: Set ownership of organized backend
  ansible.builtin.file:
    path: "{{ organized_dir }}"
    owner: "{{ organized_user }}"
    group: "{{ organized_user }}"
    recurse: true
  become: true

# --- Database ---

- name: Create organized database user
  community.postgresql.postgresql_user:
    name: "{{ organized_db_user }}"
    password: "{{ organized_db_pass }}"
    role_attr_flags: CREATEDB
  become: true
  become_user: postgres

- name: Create organized database
  community.postgresql.postgresql_db:
    name: "{{ organized_db_name }}"
    owner: "{{ organized_db_user }}"
  become: true
  become_user: postgres

# --- Environment file ---

- name: Generate Django secret key
  ansible.builtin.shell: "{{ organized_dir }}/.venv/bin/python3 -c \"import secrets,string; print(''.join(secrets.choice(string.ascii_letters+string.digits+'!@_+-=') for _ in range(50)))\""
  register: django_secret_key
  changed_when: false
  when: organized_secret_key is not defined

- name: Write organized environment file
  ansible.builtin.template:
    src: organized.env.j2
    dest: /etc/iiab/organized.env
    owner: "{{ organized_user }}"
    group: "{{ organized_user }}"
    mode: "0600"
  become: true
  notify: Restart organized

# organized.env is regenerated on every run, so any secret that lives only
# there is one provisioning away from being lost. organized.env.local is the
# machine-local override file: created once if absent, NEVER overwritten by
# Ansible, and loaded after organized.env by the units (EnvironmentFile=-),
# so its values always win. Same pattern as ai-gateway's .env.local.
- name: Ensure machine-local env override file exists (never overwritten)
  ansible.builtin.copy:
    dest: /etc/iiab/organized.env.local
    force: false
    content: |
      # Machine-local secrets and overrides — NEVER written by Ansible.
      # Loaded after organized.env by the systemd units, so values here win.
    owner: "{{ organized_user }}"
    group: "{{ organized_user }}"
    mode: "0600"
  become: true

- name: Install hourglass-check (validate Hourglass exports before import)
  ansible.builtin.copy:
    src: hourglass-check
    dest: /usr/local/bin/hourglass-check
    mode: "0755"
  become: true

- name: Install organized-import (one-shot Hourglass JSON+docx import, NWS CSV)
  ansible.builtin.copy:
    src: organized-import
    dest: /usr/local/bin/organized-import
    mode: "0755"
  become: true

- name: Create the Hourglass drop directory
  ansible.builtin.file:
    path: /library/hourglass
    state: directory
    mode: "0755"
  become: true

# --- Backend setup ---

- name: Install gunicorn in backend venv
  ansible.builtin.command: "/root/.local/bin/uv pip install gunicorn"
  args:
    chdir: "{{ organized_dir }}"
  become: true
  environment:
    VIRTUAL_ENV: "{{ organized_dir }}/.venv"
    PATH: "{{ organized_dir }}/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: organized_gunicorn
  changed_when: "'Installed' in organized_gunicorn.stderr"

# Migrations are committed in the backend repo (api/migrations/), so we only
# apply them here. Running `makemigrations` at deploy time is intentionally
# omitted — it could generate divergent migrations if models ever drift.
- name: Run organized backend migrations
  ansible.builtin.command: "{{ organized_dir }}/.venv/bin/python manage.py migrate"
  args:
    chdir: "{{ organized_dir }}"
  become: true
  become_user: "{{ organized_user }}"
  environment:
    DJANGO_SECRET_KEY: "{{ django_secret_key.stdout | default(organized_secret_key | default('temp-key-for-migrations')) }}"
    DB_NAME: "{{ organized_db_name }}"
    DB_USER: "{{ organized_db_user }}"
    DB_PASSWORD: "{{ organized_db_pass }}"
  register: organized_migrate
  changed_when: "'No migrations to apply' not in organized_migrate.stdout"

- name: Collect static files
  ansible.builtin.command: "{{ organized_dir }}/.venv/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ organized_dir }}"
  become: true
  become_user: "{{ organized_user }}"
  environment:
    DJANGO_SECRET_KEY: "{{ django_secret_key.stdout | default(organized_secret_key | default('temp-key-for-migrations')) }}"
  register: organized_collectstatic
  changed_when: "'0 static files copied' not in organized_collectstatic.stdout"

# --- Offline source-materials mirror ---

- name: Create source-materials mirror directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ organized_user }}"
    group: "{{ organized_user }}"
    mode: "0755"
  loop:
    - "{{ organized_sources_dir }}"
    - "{{ organized_sources_dir }}/api"
    - "{{ organized_sources_dir }}/input"
  become: true

- name: Install source-materials generator + fetcher scripts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: organized-sources-generate.js, dest: "{{ organized_sources_generator }}" }
    - { src: organized-sources-fetch.js, dest: "{{ organized_sources_fetcher }}" }
  become: true

- name: Install source-materials mirror systemd units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop:
    - organized-sources.service.j2
    - organized-sources.timer.j2
  become: true

# --- Systemd services ---

- name: Install organized systemd service
  ansible.builtin.template:
    src: organized.service.j2
    dest: /etc/systemd/system/organized.service
    mode: "0644"
  become: true
  notify: Restart organized

- name: Install organized celery systemd service
  ansible.builtin.template:
    src: organized-celery.service.j2
    dest: /etc/systemd/system/organized-celery.service
    mode: "0644"
  become: true
  notify: Restart organized-celery

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# --- Bookkeeping ---

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add 'organized_disk_usage = ...' to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: organized
    option: organized_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'organized_installed: True'"
  ansible.builtin.set_fact:
    organized_installed: true

- name: "Add 'organized_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^organized_installed"
    line: "organized_installed: True"
