---
# Box hardening: key-only SSH + brute-force banning.
# Everything here is idempotent — safe to re-run any time.

- name: Disable SSH password authentication (first-match drop-in beats cloud-init)
  ansible.builtin.copy:
    src: 00-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s" # Ansible requires %s: the drop-in is checked on its own before it lands
  become: true
  register: sshd_hardening

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  become: true
  when: sshd_hardening.changed

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  become: true

- name: Enable fail2ban (default sshd jail)
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true

# The host firewall is IIAB's own: /usr/bin/iiab-gen-iptables (roles/network), driven by
# ports_externally_visible in local_vars.yml (2 on the fleet: ssh, http, https). Nothing else
# (ufw and the like) may touch iptables on a box: the generator flushes and rebuilds.

# ---------------------------------------------------------------- boot network wait
- name: Drop-in directory for systemd-networkd-wait-online
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    mode: "0755"
  become: true

- name: Wait for any configured link at boot, not every interface
  ansible.builtin.copy:
    src: wait-online-any.conf
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/any.conf
    mode: "0644"
  become: true
  register: wait_online_dropin

- name: Reload systemd and clear the unit's stale failed state
  ansible.builtin.shell: systemctl daemon-reload && systemctl reset-failed systemd-networkd-wait-online.service || true
  become: true
  when: wait_online_dropin.changed
