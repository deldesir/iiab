# Box hardening: key-only SSH + brute-force banning.
# Everything here is idempotent — safe to re-run any time.

- name: Disable SSH password authentication (first-match drop-in beats cloud-init)
  copy:
    src: 00-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: '0644'
    validate: 'sshd -t -f /etc/ssh/sshd_config'
  become: yes
  register: sshd_hardening

- name: Reload sshd
  systemd:
    name: ssh
    state: reloaded
  become: yes
  when: sshd_hardening.changed

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
  become: yes

- name: Enable fail2ban (default sshd jail)
  systemd:
    name: fail2ban
    enabled: yes
    state: started
  become: yes

# ---------------------------------------------------------------- host firewall
# Public faces are ssh, http and https. Application listeners (the wiki server, the library,
# the bench's socket server) are proxied by nginx or reached over the tailnet; they must not be
# reachable on the public address. The tailnet interface is trusted as a whole.

- name: Install ufw
  apt:
    name: ufw
    state: present
  become: yes
  when: hardening_firewall

- name: Firewall policy and rules (ufw itself skips rules that already exist)
  command: "ufw {{ item }}"
  loop: "{{ ['default deny incoming', 'default allow outgoing', 'allow in on ' ~ hardening_tailnet_iface]
            + (hardening_public_tcp_ports | map('regex_replace', '^(.*)$', 'allow \\1/tcp') | list) }}"
  register: ufw_rules
  changed_when: "'Skipping' not in ufw_rules.stdout and 'already' not in ufw_rules.stdout"
  become: yes
  when: hardening_firewall

- name: Firewall status
  command: ufw status
  register: ufw_status
  changed_when: false
  become: yes
  when: hardening_firewall

- name: Enable the firewall (ssh is allowed above, so this cannot lock the operator out)
  command: ufw --force enable
  become: yes
  when: "hardening_firewall and 'Status: active' not in ufw_status.stdout"

# ---------------------------------------------------------------- boot network wait
- name: Wait for any configured link at boot, not every interface
  copy:
    src: wait-online-any.conf
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/any.conf
    mode: '0644'
  become: yes
  register: wait_online_dropin

- name: Reload systemd and clear the unit's stale failed state
  shell: systemctl daemon-reload && systemctl reset-failed systemd-networkd-wait-online.service || true
  become: yes
  when: wait_online_dropin.changed
