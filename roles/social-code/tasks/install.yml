---
# social-code/tasks/install.yml — Install Social Code training suite

- name: Install the tree, venv and environment file of Social Code (roles/uv-service)
  ansible.builtin.include_role:
    name: uv-service
  vars:
    uv_service: "{{ social_code_service }}"

- name: "Create data directory"
  ansible.builtin.file:
    path: "{{ social_code_data_dir }}"
    state: directory
    mode: "0755"

# `creates` keeps this to the first run: the command resets the database, and without --force
# it asks for a confirmation no provisioning run can give.
- name: "Initialize Small Talk database"
  ansible.builtin.command:
    cmd: "{{ social_code_uv_bin }} run --package small-talk st init --force"
    chdir: "{{ social_code_src }}"
  args:
    creates: "{{ social_code_data_dir }}/small_talk.db"

- name: "Record social-code as installed"
  ansible.builtin.lineinfile:
    path: /etc/iiab/iiab_state.yml
    regexp: "^social_code_installed:"
    line: "social_code_installed: True"
