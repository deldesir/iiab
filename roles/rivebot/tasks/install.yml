---
- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Install RiveBot system dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
    state: present
  become: true

# The gateway internal key is hand-managed in the gateway's env files (it is
# not an Ansible var on existing installs). Read it from there when the var
# is unset so re-rendering .env can never strip the key — without it every
# macro call 403s (fail-closed) and the whole chat layer silently dies.
- name: Read the gateway internal key from the gateway env (if var unset)
  ansible.builtin.shell: >-
    set -o pipefail &&
    grep -hoP '^GATEWAY_INTERNAL_KEY=\K.*'
    /opt/iiab/ai-gateway/.env.local /opt/iiab/ai-gateway/.env
    2>/dev/null | tail -1 | tr -d '"'
  register: rivebot_gateway_key_probe
  changed_when: false
  failed_when: false
  no_log: true
  become: true
  when: not (rivebot_gateway_internal_key | default(''))
  args:
    executable: /bin/bash

- name: Adopt the probed gateway internal key
  ansible.builtin.set_fact:
    rivebot_gateway_internal_key: "{{ rivebot_gateway_key_probe.stdout }}"
  no_log: true
  when:
    - not (rivebot_gateway_internal_key | default(''))
    - rivebot_gateway_key_probe.stdout | default('') | length > 0

- name: Install the tree, venv, environment file and unit of RiveBot (roles/uv-service)
  ansible.builtin.include_role:
    name: uv-service
  vars:
    uv_service: "{{ rivebot_service }}"

# RECORD RiveBot AS INSTALLED

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add rivebot_disk_usage to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: rivebot
    option: rivebot_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'rivebot_installed: True'"
  ansible.builtin.set_fact:
    rivebot_installed: true

- name: "Add 'rivebot_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^rivebot_installed"
    line: "rivebot_installed: True"
