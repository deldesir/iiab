---
- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Install RiveBot system dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
    state: present
  become: true

- name: Install uv, pinned and checked (roles/uv)
  ansible.builtin.include_role:
    name: uv

- name: Create RiveBot home directory
  ansible.builtin.file:
    path: "{{ rivebot_home }}"
    state: directory
    owner: "{{ rivebot_user }}"
    group: "{{ rivebot_user }}"
    mode: "0755"
  become: true

- name: Check if rivebot directory is already safe
  ansible.builtin.command: git config --global --get-all safe.directory
  register: git_safe_dirs
  changed_when: false
  ignore_errors: true

- name: Add rivebot directory to git safe directories
  ansible.builtin.command: git config --global --add safe.directory {{ rivebot_home }}
  become: true
  when: rivebot_home not in (git_safe_dirs.stdout_lines | default([]))
  changed_when: true   # runs only when the entry is absent

- name: Clone / update RiveBot repository
  ansible.builtin.git:
    repo: "{{ rivebot_repo }}"
    dest: "{{ rivebot_home }}"
    version: "{{ rivebot_repo_version }}"
    force: true
    update: true
  become: true
  notify: restart rivebot

- name: Set ownership of RiveBot directory
  ansible.builtin.file:
    path: "{{ rivebot_home }}"
    state: directory
    owner: "{{ rivebot_user }}"
    group: "{{ rivebot_user }}"
    recurse: true
  become: true

- name: Sync RiveBot Python dependencies (uv sync)
  ansible.builtin.command: "{{ rivebot_uv_bin }} sync --frozen"
  args:
    chdir: "{{ rivebot_home }}"
  register: rivebot_sync
  changed_when: "'Installed' in rivebot_sync.stderr or 'Uninstalled' in rivebot_sync.stderr"
  become: true

- name: Fix ownership after uv sync
  ansible.builtin.file:
    path: "{{ rivebot_home }}"
    state: directory
    owner: "{{ rivebot_user }}"
    group: "{{ rivebot_user }}"
    recurse: true
  become: true

# The gateway internal key is hand-managed in the gateway's env files (it is
# not an Ansible var on existing installs). Read it from there when the var
# is unset so re-rendering .env can never strip the key — without it every
# macro call 403s (fail-closed) and the whole chat layer silently dies.
- name: Read the gateway internal key from the gateway env (if var unset)
  ansible.builtin.shell: >-
    set -o pipefail &&
    grep -hoP '^GATEWAY_INTERNAL_KEY=\K.*'
    /opt/iiab/ai-gateway/.env.local /opt/iiab/ai-gateway/.env
    2>/dev/null | tail -1 | tr -d '"'
  register: rivebot_gateway_key_probe
  changed_when: false
  failed_when: false
  no_log: true
  become: true
  when: not (rivebot_gateway_internal_key | default(''))
  args:
    executable: /bin/bash

- name: Adopt the probed gateway internal key
  ansible.builtin.set_fact:
    rivebot_gateway_internal_key: "{{ rivebot_gateway_key_probe.stdout }}"
  no_log: true
  when:
    - not (rivebot_gateway_internal_key | default(''))
    - rivebot_gateway_key_probe.stdout | default('')

- name: Deploy RiveBot environment file
  ansible.builtin.template:
    src: rivebot.env.j2
    dest: "{{ rivebot_home }}/.env"
    owner: "{{ rivebot_user }}"
    group: "{{ rivebot_user }}"
    mode: "0600"
  become: true
  notify: restart rivebot

- name: Install RiveBot systemd service
  ansible.builtin.template:
    src: rivebot.service.j2
    dest: /etc/systemd/system/rivebot.service
    mode: "0644"
  become: true
  notify: restart rivebot

# RECORD RiveBot AS INSTALLED

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add rivebot_disk_usage to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: rivebot
    option: rivebot_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'rivebot_installed: True'"
  ansible.builtin.set_fact:
    rivebot_installed: true

- name: "Add 'rivebot_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^rivebot_installed"
    line: "rivebot_installed: True"
