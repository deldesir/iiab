---
# Main Orchestrator for RapidPro Role
# Note: is_proot is defined in default_vars.yml — no need to re-derive it here.

# The install runs once, as in every other role: a box whose state file carries
# 'rapidpro_installed' keeps its checkout, its venv and its binaries, and a role
# run only re-applies the configuration below. Code updates are the ai-update
# role's work; './runrole --reinstall rapidpro' clears the state line to install afresh.
- name: Install RapidPro if 'rapidpro_installed' not defined, e.g. in {{ iiab_state_file }}
  ansible.builtin.include_tasks: install.yml
  when:
    - rapidpro_enabled
    - rapidpro_installed is undefined

# The `centrifugo` tag on these includes lets `--tags centrifugo` reach the
# tasks inside them that carry it (the mailroom unit, the nginx files) —
# include_tasks does not pass its own tags down, so everything else in the
# included files still needs a full run.
- name: Run Configuration Tasks
  ansible.builtin.include_tasks: configure.yml
  when: rapidpro_enabled
  tags: [centrifugo, settings, mailroom-docs]

- name: Ensure Services are Started
  ansible.builtin.include_tasks: service.yml
  when: rapidpro_enabled

- name: Configure Nginx
  ansible.builtin.include_tasks: nginx.yml
  when: rapidpro_enabled
  tags: [centrifugo, nginx]

- name: Realtime sockets (Centrifugo)
  ansible.builtin.include_tasks:
    file: centrifugo.yml
    apply:
      tags: [centrifugo]
  when: rapidpro_enabled
  tags: [centrifugo]

- name: Mark RapidPro as Installed
  ansible.builtin.lineinfile:
    mode: "0644"
    path: /etc/iiab/iiab_state.yml
    line: "rapidpro_installed: true"
    create: true
  become: true
