---
# What nginx and the flow editor serve: the static build, the goflow docs, the permissions, the cache.

- name: Purge legacy spool files from pre-nanorp era
  ansible.builtin.shell: find {{ rapidpro_dir }}/spool -path '*/dynamo/*.jsonl' -o -path '*/elastic/*.jsonl' | xargs -r rm -fv
  when: not rapidpro_aws_enabled
  ignore_errors: true
  register: rapidpro_spool_purge
  changed_when: rapidpro_spool_purge.stdout | length > 0

- name: Collect static files
  ansible.builtin.shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py collectstatic --noinput
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ iiab_admin_user }}"
  register: rapidpro_collectstatic
  # the clone result only exists on a full run; a tagged run (settings) still rebuilds when the settings changed
  when: (rapidpro_git_clone | default({})).changed | default(false) or rapidpro_settings.changed
  changed_when: "'0 static files copied' not in rapidpro_collectstatic.stdout"

# the front-end resolves its own URLs against the sub-path (window.URLS.root, published by the app's frame), so
# nothing rewrites the built bundles any more; a script from the days when it did is removed
- name: Remove the retired front-end URL patch script
  ansible.builtin.file:
    path: /usr/local/sbin/rapidpro-patch-frontend-urls
    state: absent
  become: true

# the flow editor's completion docs: mailroom serves docs/ under its working directory, and upstream fills that
# from the goflow release mailroom is built against, so this does the same and remembers which one it fetched
- name: Read the goflow version mailroom is built against
  ansible.builtin.command: awk '/github.com\/nyaruka\/goflow /{print $2}' {{ rapidpro_mailroom_src_dir }}/go.mod
  register: rapidpro_goflow_version
  changed_when: false
  tags: [mailroom-docs]

- name: Read which goflow docs are installed
  ansible.builtin.command: cat {{ rapidpro_dir }}/docs/.goflow-version
  register: rapidpro_goflow_docs_installed
  changed_when: false
  failed_when: false
  tags: [mailroom-docs]

- name: Fetch the goflow docs mailroom serves
  ansible.builtin.unarchive:
    src: "https://github.com/nyaruka/goflow/releases/download/{{ rapidpro_goflow_version.stdout }}/docs.tar.gz"
    dest: "{{ rapidpro_dir }}"
    remote_src: true
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
  become: true
  when: rapidpro_goflow_docs_installed.stdout | default('') != rapidpro_goflow_version.stdout
  tags: [mailroom-docs]

- name: Record which goflow docs are installed
  ansible.builtin.copy:
    content: "{{ rapidpro_goflow_version.stdout }}"
    dest: "{{ rapidpro_dir }}/docs/.goflow-version"
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
    mode: "0644"
  become: true
  tags: [mailroom-docs]

# the docs used to be served from a stale copy of the components package through a symlink; both go
- name: Remove the legacy components copy and the editor docs symlink
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ rapidpro_dir }}/sitestatic/mr"
    - "{{ rapidpro_dir }}/sitestatic/@nyaruka"
  become: true

- name: Enforce Nginx traverse/read permissions over dynamically compiled static assets
  ansible.builtin.command: "chmod -Rc a+rX {{ rapidpro_dir }}/sitestatic {{ rapidpro_dir }}/media"
  become: true
  ignore_errors: true
  register: rapidpro_static_perms
  changed_when: rapidpro_static_perms.stdout | length > 0

- name: Purge Django Valkey/Redis cache resolving Javascript memory desynchronizations
  ansible.builtin.shell: |
    {{ rapidpro_dir }}/.venv/bin/python manage.py shell -c "from django.core.cache import cache; cache.clear()"
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  changed_when: true   # always purges
