---
# This file will contain all the installation tasks for RapidPro.
- name: The database password must be set in local_vars (no default, so a public repository never ships a working credential)
  ansible.builtin.assert:
    that:
      - rapidpro_db_pass | default('') | length > 0
    fail_msg: "rapidpro_db_pass is empty - set it in /etc/iiab/local_vars.yml (an existing install keeps its current value: set that)"
    quiet: true

- name: Drop RapidPro database if requested
  when: rapidpro_force_drop_db | default(false)
  block:
    - name: Stop RapidPro services before DB drop
      ansible.builtin.shell: "systemctl stop {{ item }} 2>/dev/null || true"
      loop:
        - rapidpro-gunicorn
        - rapidpro-courier
        - rapidpro-mailroom
        - rapidpro-celery
      become: true
      changed_when: false
      when: not is_proot

    - name: Terminate all connections to the 'temba' database
      community.postgresql.postgresql_query:
        query: "SELECT pg_terminate_backend(pg_stat_activity.pid) FROM pg_stat_activity WHERE pg_stat_activity.datname = '{{ rapidpro_db_name }}' AND pid <> pg_backend_pid();"
      become: true
      become_user: postgres

    - name: Drop RapidPro PostgreSQL database
      community.postgresql.postgresql_db:
        name: "{{ rapidpro_db_name }}"
        state: absent
      become: true
      become_user: postgres

    - name: Drop RapidPro PostgreSQL user
      community.postgresql.postgresql_user:
        name: "{{ rapidpro_db_user }}"
        state: absent
      become: true
      become_user: postgres

- name: Uninstall RapidPro if reinstalling
  when: reinstall is defined and reinstall
  block:
    - name: Remove RapidPro directory
      ansible.builtin.file:
        path: "{{ rapidpro_dir }}"
        state: absent
      become: true

- name: Install essential build tools and libraries
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - libpq-dev
      - python3-dev
      - libgdal-dev
      - ffmpeg
      - postgis
      - screen
    state: present
  become: true

- name: Ensure pgvector for the knowledge app
  ansible.builtin.include_tasks: pgvector.yml
- name: Ensure bun for the components build
  ansible.builtin.include_tasks: bun.yml
- name: Install Valkey/Redis
  block:
    - name: Try installing valkey-server
      ansible.builtin.apt:
        name: valkey-server
        state: present
      become: true
  rescue:
    - name: Fallback to redis-server
      ansible.builtin.apt:
        name: redis-server
        state: present
      become: true

- name: Install Python build dependencies
  ansible.builtin.apt:
    name:
      - make
      - libssl-dev
      - zlib1g-dev
      - libffi-dev
      - wget
      - curl
      - python3-openssl
    state: present
  become: true

- name: "Set 'nodejs_install: True' and 'nodejs_enabled: True'"
  ansible.builtin.set_fact:
    nodejs_install: true
    nodejs_enabled: true

- name: Include nodejs role
  ansible.builtin.include_role:
    name: nodejs

- name: Check if rapidpro directory is already safe
  ansible.builtin.command: git config --global --get-all safe.directory
  register: git_safe_dirs
  changed_when: false
  ignore_errors: true

- name: Add rapidpro directory to git safe directories
  ansible.builtin.command: git config --global --add safe.directory {{ rapidpro_dir }}
  become: true
  when: rapidpro_dir not in (git_safe_dirs.stdout_lines | default([]))

- name: Clone/update RapidPro repository
  ansible.builtin.git:
    repo: "https://github.com/deldesir/rapidpro.git"
    dest: "{{ rapidpro_dir }}"
    force: true
    # OPTIONAL STATIC TAG (Option B): Uncomment below and comment 'main' above to use auto-manipulator script.
    # version: v26.1.87
    version: main
  become: true
  register: rapidpro_git_clone

- name: Set ownership of project directory (fast)
  ansible.builtin.command: "chown -R {{ iiab_admin_user }}:{{ iiab_admin_user }} {{ rapidpro_dir }}"
  become: true
  changed_when: false

- name: Deploy Branding Script and Assets
  ansible.builtin.copy:
    src: branding/
    dest: /opt/iiab/
    owner: "{{ iiab_admin_user }}"
    mode: "0755"
  become: true

- name: "Widen Python version constraint in pyproject.toml"
  ansible.builtin.replace:
    path: "{{ rapidpro_dir }}/pyproject.toml"
    regexp: 'requires-python = ">=3\.\d+(\.\d+)?,<3\.\d+"'
    replace: 'requires-python = ">=3.12"'
  become: true
  ignore_errors: true

- name: uv, pinned and checked (roles/uv)
  ansible.builtin.include_role:
    name: uv

- name: Install required Python version via uv
  ansible.builtin.shell: |
    {{ uv_bin }} python install
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ iiab_admin_user }}"
  changed_when: false

- name: Create uv virtual environment (only when missing; a routine run never clears it)
  ansible.builtin.command: "{{ uv_bin }} venv"
  args:
    chdir: "{{ rapidpro_dir }}"
    creates: "{{ rapidpro_dir }}/.venv/bin/python"
  become: true
  become_user: "{{ iiab_admin_user }}"

# The fork's uv.lock is the truth: no `uv lock --upgrade` here (it silently bumped every
# dependency on each run and once brought in a database driver change that took the gateway
# down). A dependency change is a commit to the fork.
- name: Sync dependencies from the lock file (uv sync --frozen)
  ansible.builtin.command: "{{ uv_bin }} sync --frozen"
  args:
    chdir: "{{ rapidpro_dir }}"
  register: rapidpro_sync
  changed_when: "'Installed' in rapidpro_sync.stderr or 'Uninstalled' in rapidpro_sync.stderr"
  become: true
  become_user: "{{ iiab_admin_user }}"

# temba's own JS tooling is bun (bun.lock + bunfig.toml are tracked; its
# tw-watch script runs `bun run tw-build`). bun is installed by bun.yml above
# for the components build, so the tailwind build uses it too and nothing is
# installed through yarn or npm any more. Run as the service user so no
# root-owned files land in the checkout.
- name: Install JavaScript dependencies (bun, locked)
  ansible.builtin.command: /usr/local/bin/bun install --frozen-lockfile
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ iiab_admin_user }}"
  register: rapidpro_bun_install
  changed_when: "'no changes' not in rapidpro_bun_install.stdout"

- name: Build CSS assets
  ansible.builtin.command: /usr/local/bin/bun run tw-build
  args:
    chdir: "{{ rapidpro_dir }}"
  become: true
  become_user: "{{ iiab_admin_user }}"
  changed_when: false

- name: Remove the yarn lockfile earlier role runs generated
  ansible.builtin.file:
    path: "{{ rapidpro_dir }}/yarn.lock"
    state: absent
  become: true

- name: Restore RapidPro Directory Ownership (after root build steps)
  ansible.builtin.command: "chown -R {{ iiab_admin_user }}:{{ iiab_admin_user }} {{ rapidpro_dir }}"
  become: true
  when: rapidpro_git_clone.changed or rapidpro_bun_install.changed

- name: Allow Nginx traversal of RapidPro directory (Professional Fix)
  ansible.builtin.file:
    path: "{{ rapidpro_dir }}"
    mode: "0755"
    state: directory
  become: true

- name: Install RapidPro Binaries (Universal)
  ansible.builtin.include_tasks: install_binary.yml
