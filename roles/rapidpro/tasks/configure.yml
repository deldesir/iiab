- name: Create PostgreSQL user
  postgresql_user:
    name: "{{ rapidpro_db_user }}"
    password: "{{ rapidpro_db_pass }}"
    login_host: 127.0.0.1
  become: yes
  become_user: postgres

- name: Create PostgreSQL database
  postgresql_db:
    name: "{{ rapidpro_db_name }}"
    owner: "{{ rapidpro_db_user }}"
    login_host: 127.0.0.1
  become: yes
  become_user: postgres

- name: Enable PostgreSQL extensions
  postgresql_ext:
    name: "{{ item }}"
    login_db: "{{ rapidpro_db_name }}"
    login_host: 127.0.0.1
  loop:
    - postgis
    - postgis_topology
    - hstore
    - "uuid-ossp"
    - vector    # pgvector >= 0.8, built from source in install.yml (knowledge app)
  become: yes
  become_user: postgres

# settings_common.py is tracked in the fork and comes with the code; everything deployment-specific - the secret
# key, the DB password, tokens, hosts, the sub-path - is rendered here into the ignored settings.py, readable by
# the service user only. Tagged so it can be re-rendered alone after a local_vars.yml change.
- name: Configure RapidPro settings
  template:
    src: settings.py.j2
    dest: "{{ rapidpro_dir }}/temba/settings.py"
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
    mode: '0600'
  become: yes
  register: rapidpro_settings
  tags: [settings]

- name: Ensure RapidPro log directory permissions (Hardening)
  file:
    path: /var/log/rapidpro
    state: directory
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
    mode: '0755'
    recurse: yes
  become: yes





- name: Copy prebuilt database dump (Android)
  copy:
    src: rapidpro_android_seed.dump
    dest: /tmp/rapidpro_android_seed.dump
    mode: '0644'
  when: is_proot
  become: yes

- name: Check if database is populated (Android)
  shell: |
    export PGHOST=/tmp
    psql -d {{ rapidpro_db_name }} -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" -t
  become: yes
  become_user: postgres
  register: db_table_count
  when: is_proot
  changed_when: false
  ignore_errors: yes

- name: Restore prebuilt database (Android)
  shell: |
    export PGHOST=/tmp
    pg_restore -d {{ rapidpro_db_name }} /tmp/rapidpro_android_seed.dump || true
  become: yes
  become_user: postgres
  when: is_proot and (db_table_count.stdout | default('0') | trim | int == 0)

- name: Run database migrations
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py migrate
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"

# the Postgres indexes contact and message search use without Elasticsearch; idempotent, kept out of the
# migration graph so they never collide with upstream's numbering
- name: Create the Postgres search indexes
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py nanorp_indexes
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"
  when: not rapidpro_aws_enabled

- name: Run DynamoDB migrations (create tables)
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py migrate_dynamo
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"
  when: rapidpro_aws_enabled

- name: Purge legacy spool files from pre-nanorp era
  shell: rm -f /opt/iiab/rapidpro/spool/*/dynamo/*.jsonl /opt/iiab/rapidpro/spool/*/elastic/*.jsonl
  when: not rapidpro_aws_enabled
  ignore_errors: true

- name: Collect static files
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py collectstatic --noinput
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"
  register: rapidpro_collectstatic
  # the clone result only exists on a full run; a tagged run (settings) still rebuilds when the settings changed
  when: (rapidpro_git_clone | default({})).changed | default(false) or rapidpro_settings.changed

- name: Fix missing editor.json localization (Wuzapi Regression Fix)
  shell: |
    mkdir -p /opt/iiab/rapidpro/sitestatic/@nyaruka/temba-components/static/mr/docs/fr
    ln -sf ../en-us/editor.json /opt/iiab/rapidpro/sitestatic/@nyaruka/temba-components/static/mr/docs/fr/editor.json
  become: yes

# the front-end resolves its own URLs against the sub-path (window.URLS.root, published by the app's frame), so
# nothing rewrites the built bundles any more; a script from the days when it did is removed
- name: Remove the retired front-end URL patch script
  file:
    path: /usr/local/sbin/rapidpro-patch-frontend-urls
    state: absent
  become: yes

- name: Symlink mr directory for temba-store
  file:
    src: "{{ rapidpro_dir }}/sitestatic/@nyaruka/temba-components/static/mr"
    dest: "{{ rapidpro_dir }}/sitestatic/mr"
    state: link
  become_user: "{{ iiab_admin_user }}"
  become: yes

- name: Enforce Nginx traverse/read permissions over dynamically compiled static assets
  command: "chmod -R a+rX {{ rapidpro_dir }}/sitestatic {{ rapidpro_dir }}/media"
  become: yes
  ignore_errors: true

- name: Purge Django Valkey/Redis cache resolving Javascript memory desynchronizations
  shell: |
    {{ rapidpro_dir }}/.venv/bin/python manage.py shell -c "from django.core.cache import cache; cache.clear()"
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes

# the first admin, created with Django's own command; without a password in local_vars.yml no user is created,
# rather than one with a guessable password
- name: Check whether the admin user exists
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py shell -c "from temba.users.models import User; print('EXISTS' if User.objects.filter(email__iexact='{{ admin_email }}').exists() else 'MISSING')"
  args:
    chdir: "{{ rapidpro_dir }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"
  register: superuser_check
  changed_when: false

- name: Refuse to create the admin user without rapidpro_admin_password
  assert:
    that:
      - rapidpro_admin_password | default('') | length > 0
    fail_msg: "rapidpro_admin_password is empty - set it in /etc/iiab/local_vars.yml before the admin user can be created"
    quiet: true
  when: "'MISSING' in superuser_check.stdout"

- name: Create the admin user
  shell: |
    export PATH="/home/{{ iiab_admin_user }}/.local/bin:$PATH"
    uv run python manage.py createsuperuser --noinput
  args:
    chdir: "{{ rapidpro_dir }}"
  environment:
    DJANGO_SUPERUSER_EMAIL: "{{ admin_email }}"
    DJANGO_SUPERUSER_PASSWORD: "{{ rapidpro_admin_password }}"
  become: yes
  become_user: "{{ iiab_admin_user }}"
  when: "'MISSING' in superuser_check.stdout"
  no_log: true

- name: Create gunicorn run directory
  file:
    path: "{{ rapidpro_dir }}/run"
    state: directory
    owner: "{{ iiab_admin_user }}"
    group: "www-data"
    mode: "0770"
  become: yes

- name: Check for valkey-server service
  stat:
    path: /lib/systemd/system/valkey-server.service
  register: valkey_service
  tags: [centrifugo]    # the mailroom unit template needs valkey_service_name

- name: Set valkey service name
  set_fact:
    valkey_service_name: "{{ 'valkey-server.service' if valkey_service.stat.exists else 'redis-server.service' }}"
  tags: [centrifugo]

- name: Create Gunicorn systemd service
  template:
    src: rapidpro-gunicorn.service.j2
    dest: /etc/systemd/system/rapidpro-gunicorn.service
  become: yes



# Mailroom and courier embed the DB URL (with password) in Environment=
# lines — systemd only needs root to read unit files, so keep these two
# out of reach of other local accounts.
- name: Create Mailroom systemd service
  template:
    src: rapidpro-mailroom.service.j2
    dest: /etc/systemd/system/rapidpro-mailroom.service
    mode: '0600'
  become: yes
  register: rapidpro_mailroom_unit    # centrifugo.yml restarts mailroom on change in a tag-filtered run
  tags: [centrifugo]

- name: Create Courier systemd service
  template:
    src: rapidpro-courier.service.j2
    dest: /etc/systemd/system/rapidpro-courier.service
    mode: '0600'
  become: yes



- name: Create Celery systemd service
  template:
    src: rapidpro-celery.service.j2
    dest: /etc/systemd/system/rapidpro-celery.service
  become: yes

- name: Install flow-export script (flows live only in Postgres otherwise)
  copy:
    src: rapidpro-flows-export
    dest: /usr/local/sbin/rapidpro-flows-export
    mode: '0755'
  become: yes

- name: Create flow-export systemd units
  template:
    src: "rapidpro-flows-export.{{ item }}.j2"
    dest: "/etc/systemd/system/rapidpro-flows-export.{{ item }}"
  loop: [service, timer]
  become: yes

- name: Enable nightly flow export
  systemd:
    name: rapidpro-flows-export.timer
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  when: not is_proot

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes
  when: not is_proot

# collectstatic ran, so the code or the settings changed: the app and its workers pick both up on restart
- name: Restart RapidPro Gunicorn and Celery if code or settings changed
  systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - rapidpro-gunicorn
    - rapidpro-celery
  become: yes
  when: rapidpro_collectstatic is changed and not is_proot

- name: Restart RapidPro Gunicorn if code or settings changed (Android)
  shell: /usr/local/bin/pdsm restart rapidpro-server
  become: yes
  when: rapidpro_collectstatic is changed and is_proot

- name: Start RapidPro Watchdog (Android) ensures services stay running
  shell: /usr/local/bin/pdsm start rapidpro-watchdog
  become: yes
  when: is_proot

- name: Enable or disable RapidPro services
  include_tasks: enable-or-disable.yml
