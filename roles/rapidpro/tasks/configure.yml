---
# Configure tasks: the six steps in order, each its own file (imported statically, so the tags
# the tasks carry - settings, mailroom-docs, centrifugo - keep working for a tagged run), then
# the enable-or-disable step. The steps share their registered results: the settings result
# decides the static build, the static build decides the restarts.

- name: The database, its role and extensions
  ansible.builtin.import_tasks: database.yml

- name: The settings file and the log directory
  ansible.builtin.import_tasks: settings.yml

- name: The schema (seed, migrations, indexes)
  ansible.builtin.import_tasks: migrate.yml

- name: The static build, the editor docs, the permissions, the cache
  ansible.builtin.import_tasks: static.yml

- name: The first admin user
  ansible.builtin.import_tasks: admin.yml

- name: The systemd units, the flow export, the restarts
  ansible.builtin.import_tasks: units.yml

- name: Enable or disable RapidPro services
  ansible.builtin.include_tasks: enable-or-disable.yml
