---
# --- Systemd path (standard Linux) ---

- name: Manage Gunicorn service (systemd)
  ansible.builtin.systemd:
    name: rapidpro-gunicorn
    state: "{{ 'started' if rapidpro_enabled else 'stopped' }}"
    enabled: "{{ rapidpro_enabled }}"
    daemon_reload: true
  become: true
  when: not is_proot

- name: Manage Go services (systemd)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'started' if rapidpro_enabled else 'stopped' }}"
    enabled: "{{ rapidpro_enabled }}"
    daemon_reload: true
  loop:
    - rapidpro-mailroom
    - rapidpro-courier
    - rapidpro-celery
  become: true
  when: not is_proot

# --- pdsm path (proot/Android) ---

- name: Enable & start RapidPro services via pdsm (Android/Proot)
  when:
    - rapidpro_enabled
    - is_proot
  block:
    - name: "Android (pdsm): enable all RapidPro services"
      ansible.builtin.command: /usr/local/bin/pdsm enable {{ item }}
      args:
        creates: /usr/local/pdsm/services-enabled/{{ item }}   # pdsm enable = this symlink; it prints "enabled" either way
      loop:
        - rapidpro-gunicorn
        - rapidpro-mailroom
        - rapidpro-courier
        - rapidpro-celery

    - name: "Android (pdsm): start all RapidPro services"
      ansible.builtin.command: /usr/local/bin/pdsm start {{ item }}
      loop:
        - rapidpro-gunicorn
        - rapidpro-mailroom
        - rapidpro-courier
        - rapidpro-celery
      register: pdsm_start
      changed_when: "'already running' not in pdsm_start.stdout"

- name: Disable & stop RapidPro services via pdsm (Android/Proot)
  when:
    - not rapidpro_enabled
    - is_proot
  block:
    - name: "Android (pdsm): stop all RapidPro services"
      ansible.builtin.command: /usr/local/bin/pdsm stop {{ item }}
      loop:
        - rapidpro-gunicorn
        - rapidpro-mailroom
        - rapidpro-courier
        - rapidpro-celery
      register: pdsm_stop
      changed_when: "'not running' not in pdsm_stop.stdout"
      failed_when: false

    - name: "Android (pdsm): disable all RapidPro services"
      ansible.builtin.command: /usr/local/bin/pdsm disable {{ item }}
      loop:
        - rapidpro-gunicorn
        - rapidpro-mailroom
        - rapidpro-courier
        - rapidpro-celery
      register: pdsm_disable
      changed_when: "'is not enabled' not in pdsm_disable.stdout"   # pdsm's message for an already disabled service
      failed_when: false
