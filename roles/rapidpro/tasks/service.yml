---
# Service Management (Systemd vs PDSM)

# --- Systemd path (standard Linux) ---

- name: Systemd - Ensure Infrastructure Services are Running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - postgresql-iiab   # the IIAB cluster; the stock unit stays manual so it never squats the port
    - "{{ valkey_service_name }}"
  become: true
  when: not is_proot

- name: Systemd - Force Restart RapidPro Services (Fresh Start)
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - rapidpro-gunicorn
    - rapidpro-courier
    - rapidpro-mailroom
    - rapidpro-celery
  become: true
  when: not is_proot

# --- pdsm path (proot/Android) ---

- name: "Android (pdsm): enable the RapidPro services"
  ansible.builtin.command: /usr/local/bin/pdsm enable {{ item }}
  args:
    creates: /usr/local/pdsm/services-enabled/{{ item }}   # pdsm enable = this symlink; it prints "enabled" either way
  loop:
    - postgresql
    - valkey
    - rapidpro-gunicorn
    - rapidpro-courier
    - rapidpro-mailroom
    - rapidpro-celery
  become: true
  when: is_proot

- name: "Android (pdsm): start the infrastructure services"
  ansible.builtin.command: /usr/local/bin/pdsm start {{ item }}
  loop:
    - postgresql
    - valkey
  register: pdsm_infra_start
  changed_when: "'already running' not in pdsm_infra_start.stdout"
  become: true
  when: is_proot

- name: Wait for Database Ready (All Platforms)
  ansible.builtin.wait_for:
    port: 5432
    host: 127.0.0.1
    timeout: 300

- name: "Android (pdsm): start the RapidPro application services"
  ansible.builtin.command: /usr/local/bin/pdsm start {{ item }}
  loop:
    - rapidpro-gunicorn
    - rapidpro-courier
    - rapidpro-mailroom
    - rapidpro-celery
  register: pdsm_app_start
  changed_when: "'already running' not in pdsm_app_start.stdout"
  become: true
  when: is_proot
