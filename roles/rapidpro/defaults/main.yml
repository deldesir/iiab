---
# Defaults for the rapidpro role

python_version: "3.13.5"
rapidpro_db_name: "temba"
rapidpro_db_user: "temba"
rapidpro_db_pass: ""   # no default: set it in /etc/iiab/local_vars.yml; the role refuses to run while it is empty
nodejs_version: "24"
rapidpro_dir: "/opt/iiab/rapidpro"
rapidpro_install: True
rapidpro_enabled: True

admin_email: "admin@box.lan"
rapidpro_admin_password: ""

# Hostname Configuration
rapidpro_hostname: "{{ iiab_hostname }}"
rapidpro_http_protocol: "http"

rapidpro_url: /rp

# Bind the courier/mailroom PUBLIC web servers (channel-webhook receivers:
# courier :8080, mailroom :8090) to loopback only. Every client is local —
# wuzapi and the email-bridge POST to 127.0.0.1, and RapidPro talks to mailroom's
# separate INTERNAL server on 127.0.0.1:8091 — so loopback keeps these services
# off the LAN/WAN. Defense-in-depth: the IIAB firewall already drops the WAN at
# ports_externally_visible<3, and this additionally protects hotspot LANs
# (lan != none), where the all-interfaces default would otherwise be reachable.
# Set to "" (all interfaces) ONLY if you add an EXTERNAL webhook channel that
# must reach courier on the box's IP.
rapidpro_public_bind_address: "127.0.0.1"

# mailroom's public server (its default port); nginx forwards the flow editor's completion docs to it
rapidpro_mailroom_port: 8090
# the mailroom source checkout: its go.mod names the goflow release whose docs mailroom serves
rapidpro_mailroom_src_dir: /opt/iiab/mailroom

rapidpro_drop_db_on_reinstall: false
rapidpro_force_drop_db: false

wuzapi_port: 8095

wuzapi_admintoken: ""
rapidpro_secret_key: ""
# temba v26.3.107+: shared secret for the internal-only API under /ti/ (system
# check requires it). Set a distinct value in local_vars.yml; empty falls back
# to rapidpro_secret_key.
rapidpro_internal_auth_token: ""

# AWS mode: set to false to disable S3 + DynamoDB and use local storage only
rapidpro_aws_enabled: false

# Domain for courier (used in attachment URLs)
rapidpro_domain: "{{ rapidpro_hostname }}"
# the host written into attachment URLs: the site's public name when TLS is set up, the box otherwise
rapidpro_media_domain: "{{ iiab_ssl_domain | default(rapidpro_domain, true) }}"

# AWS Configuration (S3 + DynamoDB) — used when rapidpro_aws_enabled is true
rapidpro_aws_access_key_id: ""
rapidpro_aws_secret_access_key: ""
rapidpro_aws_region: "us-east-1"

# S3 bucket prefix — buckets: {prefix}-default, {prefix}-attachments, {prefix}-archives
rapidpro_s3_bucket_prefix: "temba"

# DynamoDB table prefix
rapidpro_dynamo_table_prefix: "Temba"

# Architecture mapping (follows kiwix/gitea pattern)
rapidpro_arch_dict:
  x86_64: amd64
  aarch64: arm64

rapidpro_go_arch: "{{ rapidpro_arch_dict.get(ansible_facts.machine, 'unsupported') }}"

# The sources. The web application is cloned by this role; the courier and mailroom checkouts
# are kept by the updater (roles/ai-update) for its fallback build and for the goflow docs.
rapidpro_repo: "https://github.com/deldesir/rapidpro.git"
rapidpro_version: main
rapidpro_courier_src_dir: /opt/iiab/courier
rapidpro_courier_repo: "https://github.com/deldesir/courier.git"
rapidpro_courier_version: main
rapidpro_mailroom_repo: "https://github.com/deldesir/mailroom.git"
rapidpro_mailroom_version: main

# The Go services' release binaries, each pinned to a tag: the install and the update path both
# read these, and install-release-binary.sh verifies the asset against the tag's SHA256SUMS.
# A sync round bumps the tags here (one change, reviewed) instead of following "latest".
rapidpro_mailroom_release: v26.3.102
rapidpro_courier_release: v26.3.64
rapidpro_mailroom_binary_url: "https://github.com/deldesir/mailroom/releases/download/{{ rapidpro_mailroom_release }}/mailroom-linux-{{ rapidpro_go_arch }}"
rapidpro_courier_binary_url: "https://github.com/deldesir/courier/releases/download/{{ rapidpro_courier_release }}/courier-linux-{{ rapidpro_go_arch }}"
rapidpro_mailroom_bin: /usr/local/bin/mailroom
rapidpro_courier_bin: /usr/local/bin/courier

# --- Realtime sockets (Centrifugo) ------------------------------------------
# temba's live UI — ticket inbox, contact chat, typing indicators, in-app
# notifications, flow-editor activity and the webchat widget — talks to a
# Centrifugo server at wss://<host>/ws/connect. Without it those pages only
# update on reload. Off by default: enabling needs rapidpro_centrifugo_api_key
# in local_vars.yml (e.g. `openssl rand -hex 32`); the role refuses to enable
# without one. Loopback-only, stateless (memory engine), nothing to back up.
# Systemd hosts only (no pdsm/Android path yet).
rapidpro_centrifugo_enabled: false
rapidpro_centrifugo_version: "6.9.6"
rapidpro_centrifugo_port: 8092            # Centrifugo itself; nginx fronts /ws/connect
rapidpro_internal_http_port: 8093         # loopback nginx listener for temba's /ti/ API
rapidpro_centrifugo_api_key: ""           # shared with mailroom (MAILROOM_CENTRIFUGO_KEY)
rapidpro_centrifugo_log_level: "info"
# Browser origins Centrifugo accepts. temba strips session identity from any
# origin it doesn't serve itself, so "*" is safe for the desk and is what lets
# the webchat widget be embedded on other sites. Narrow it (e.g.
# ["https://box.lan"]) if you never embed webchat elsewhere.
rapidpro_centrifugo_allowed_origins: ["*"]
rapidpro_centrifugo_download_url: "https://github.com/centrifugal/centrifugo/releases/download/v{{ rapidpro_centrifugo_version }}/centrifugo_{{ rapidpro_centrifugo_version }}_linux_{{ rapidpro_go_arch }}.tar.gz"
rapidpro_centrifugo_checksums_url: "https://github.com/centrifugal/centrifugo/releases/download/v{{ rapidpro_centrifugo_version }}/centrifugo_{{ rapidpro_centrifugo_version }}_checksums.txt"
