---
# SSL/TLS Certificate Automation — main entry point
# Installs certbot, obtains Let's Encrypt certificate, sets up auto-renewal

# ── Assert booleans ──────────────────────────────────────────
- name: Assert that "ssl_install is sameas true" (boolean not string etc)
  ansible.builtin.assert:
    that: ssl_install is sameas true
    fail_msg: "PLEASE SET 'ssl_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: true

- name: Assert that "ssl_enabled | type_debug == 'bool'" (boolean not string etc)
  ansible.builtin.assert:
    that: ssl_enabled | type_debug == 'bool'
    fail_msg: >-
      PLEASE GIVE VARIABLE 'ssl_enabled' A PROPER (UNQUOTED) ANSIBLE
      BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml
    quiet: true

# ── Main block with rescue ───────────────────────────────────
- block:
    # VALIDATION
    - name: Assert that iiab_ssl_enabled is True
      ansible.builtin.assert:
        that: iiab_ssl_enabled | bool
        fail_msg: "SSL role requires iiab_ssl_enabled: True in local_vars.yml"

    - name: Assert that iiab_ssl_domain is set and not the default 'box.lan'
      ansible.builtin.assert:
        that:
          - iiab_ssl_domain is defined
          - iiab_ssl_domain | length > 0
          - iiab_ssl_domain != "box.lan"
        fail_msg: "SSL role requires iiab_ssl_domain to be set to your real domain in local_vars.yml (not 'box.lan')"

    - name: Assert that iiab_ssl_certbot_email is set
      ansible.builtin.assert:
        that:
          - iiab_ssl_certbot_email is defined
          - iiab_ssl_certbot_email | length > 0
        fail_msg: "SSL role requires iiab_ssl_certbot_email to be set in local_vars.yml"

    # INSTALL
    - name: Install SSL certificate automation (certbot + Let's Encrypt)
      ansible.builtin.include_tasks: install.yml
      when: ssl_installed is undefined

    # ENABLE / DISABLE
    - name: Enable or disable certificate auto-renewal
      ansible.builtin.include_tasks: enable-or-disable.yml
    - name: Record (initial) disk space used
      ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
      register: df1
      changed_when: false
      args:
        executable: /bin/bash

    - name: Record (final) disk space used
      ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
      register: df2
      changed_when: false
      args:
        executable: /bin/bash

    - name: Add 'ssl_disk_usage = {{ df2.stdout | int - df1.stdout | int }}' to {{ iiab_ini_file }}
      community.general.ini_file:
        path: "{{ iiab_ini_file }}" # /etc/iiab/iiab.ini
        section: ssl
        option: ssl_disk_usage
        value: "{{ df2.stdout | int - df1.stdout | int }}"

    - name: Add 'ssl' variable values to {{ iiab_ini_file }}
      community.general.ini_file:
        path: "{{ iiab_ini_file }}"
        section: ssl
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: SSL
        - option: description
          value: '"Automated SSL/TLS certificate provisioning via Let''s Encrypt certbot"'
        - option: ssl_install
          value: "{{ ssl_install }}"
        - option: ssl_enabled
          value: "{{ ssl_enabled }}"
        - option: ssl_domain
          value: "{{ iiab_ssl_domain }}"

    - name: "Set 'ssl_installed: True'"
      ansible.builtin.set_fact:
        ssl_installed: true

    - name: "Add 'ssl_installed: True' to {{ iiab_state_file }}"
      ansible.builtin.lineinfile:
        path: "{{ iiab_state_file }}" # /etc/iiab/iiab_state.yml
        regexp: "^ssl_installed"
        line: "ssl_installed: True"

  rescue:
    - name: "SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})"
      ansible.builtin.fail:
        msg: ""
      when: not skip_role_on_error
