---
- name: Enable & Restart 'wuzapi' systemd service, if wuzapi_enabled
  ansible.builtin.systemd:
    name: wuzapi
    daemon_reload: true
    enabled: true
    state: restarted
  when:
    - wuzapi_enabled
    - not is_proot

- name: Disable & Stop 'wuzapi' systemd service, if not wuzapi_enabled
  ansible.builtin.systemd:
    name: wuzapi
    enabled: false
    state: stopped
  when:
    - not wuzapi_enabled
    - not is_proot

- name: Enable & start Wuzapi service via pdsm (Android/Proot)
  when:
    - wuzapi_enabled
    - is_proot
  block:
    - name: "Android (pdsm): enable wuzapi"
      ansible.builtin.command: /usr/local/bin/pdsm enable wuzapi
      args:
        creates: /usr/local/pdsm/services-enabled/wuzapi   # pdsm enable = this symlink; it prints "enabled" either way
    - name: "Android (pdsm): start wuzapi"
      ansible.builtin.command: /usr/local/bin/pdsm start wuzapi
      register: pdsm_wuzapi_start
      changed_when: "'already running' not in pdsm_wuzapi_start.stdout"

- name: Configure Nginx for Wuzapi, if wuzapi_enabled
  ansible.builtin.template:
    mode: "0644"
    src: wuzapi-nginx.conf.j2
    dest: /etc/nginx/conf.d/wuzapi.conf
  become: true
  when: wuzapi_enabled
  notify: Reload nginx

- name: Remove Nginx config for Wuzapi, if not wuzapi_enabled
  ansible.builtin.file:
    path: /etc/nginx/conf.d/wuzapi.conf
    state: absent
  become: true
  when: not wuzapi_enabled
  notify: Reload nginx
