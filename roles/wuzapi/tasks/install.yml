---
- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - git
      - make
      - ffmpeg
      - sqlite3
      - libsqlite3-dev
    state: present
  become: true

- name: Create Wuzapi directory
  ansible.builtin.file:
    mode: "0755"
    path: "{{ wuzapi_dir }}"
    state: directory
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
  become: true

# Download via the shared helper: prefer gzipped asset, verify SHA256SUMS, raw fallback.
- name: Install Wuzapi Binary from Release (gz-preferred, checksum-verified)
  ansible.builtin.command: bash /opt/iiab/iiab/scripts/install-release-binary.sh "https://github.com/deldesir/wuzapi/releases/latest/download/wuzapi-linux-{{ wuzapi_go_arch }}" "{{ wuzapi_dir }}/wuzapi"
  become: true
  register: wuzapi_binary
  changed_when: "'installed' in wuzapi_binary.stdout"

- name: Clone Wuzapi repository (for static assets)
  ansible.builtin.git:
    repo: "https://github.com/deldesir/wuzapi.git"
    dest: "/opt/iiab/wuzapi-src"
    version: "main"
    update: true
  become: true

- name: Copy static assets to install directory
  ansible.builtin.copy:
    mode: preserve
    src: "/opt/iiab/wuzapi-src/static"
    dest: "{{ wuzapi_dir }}/"
    remote_src: true
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
  become: true

- name: Ensure correct ownership for Wuzapi directory
  ansible.builtin.file:
    path: "{{ wuzapi_dir }}"
    owner: "{{ iiab_admin_user }}"
    group: "{{ iiab_admin_user }}"
    recurse: true
    state: directory
  become: true

- name: Install Wuzapi systemd service, 0600 (the unit carries the encryption, HMAC and admin keys)
  ansible.builtin.template:
    src: wuzapi.service.j2
    dest: /etc/systemd/system/wuzapi.service
    mode: "0600"
  become: true

# /etc/iiab is world-traversable (0755), so the lookup('password')-generated
# global key files must be locked down to root-only.
- name: Secure the auto-generated wuzapi global key files (0600)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - "{{ iiab_etc_path }}/wuzapi_global_encryption_key"
    - "{{ iiab_etc_path }}/wuzapi_global_hmac_key"
  become: true

- name: Symlink Wuzapi binary to path (Android)
  ansible.builtin.file:
    src: "{{ wuzapi_dir }}/wuzapi"
    dest: /usr/local/bin/wuzapi
    state: link
  become: true
  when: is_proot

# RECORD WuzAPI AS INSTALLED

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add wuzapi_disk_usage to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: wuzapi
    option: wuzapi_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'wuzapi_installed: True'"
  ansible.builtin.set_fact:
    wuzapi_installed: true

- name: "Add 'wuzapi_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^wuzapi_installed"
    line: "wuzapi_installed: True"
