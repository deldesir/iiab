---
# Install tasks for ERPNext

- name: Does the site exist already?
  ansible.builtin.stat:
    path: "/home/{{ erpnext_user_name }}/frappe-bench/sites/{{ erpnext_site_name }}/site_config.json"
  register: erpnext_site_config

# The database password is used on every run (the site configuration is kept in step with it),
# the Administrator password only when the site is created: an existing site's Administrator
# password lives hashed in that site and is not something this role knows or needs.
- name: The database password must be set in local_vars (no default, so a public repository never ships a working credential)
  ansible.builtin.assert:
    that:
      - erpnext_db_password | default('') | length > 0
    fail_msg: "erpnext_db_password is empty - set it in /etc/iiab/local_vars.yml to the value the site uses (sites/<site>/site_config.json on an existing install)"
    quiet: true

- name: The Administrator password must be set in local_vars before the site is created
  ansible.builtin.assert:
    that:
      - erpnext_admin_password | default('') | length > 0
    fail_msg: "erpnext_admin_password is empty - set it in /etc/iiab/local_vars.yml before the site is created"
    quiet: true
  when: not erpnext_site_config.stat.exists

- name: "Set 'mysql_install: True' and 'mysql_enabled: True'"
  ansible.builtin.set_fact:
    mysql_install: true
    mysql_enabled: true

- name: MYSQL - run 'mysql' role (attempt to install & enable MySQL / MariaDB)
  ansible.builtin.include_role:
    name: mysql

- name: FAIL (STOP THE INSTALL) IF 'mysql_installed is undefined'
  ansible.builtin.fail:
    msg: "ERPNext install cannot proceed, as MySQL / MariaDB is not installed."
  when: mysql_installed is undefined

- name: "Set 'nodejs_install: True' and 'nodejs_enabled: True'"
  ansible.builtin.set_fact:
    nodejs_install: true
    nodejs_enabled: true

- name: NODEJS - run 'nodejs' role (attempt to install & enable Node.js)
  ansible.builtin.include_role:
    name: nodejs

- name: FAIL (STOP THE INSTALL) IF 'nodejs_installed is undefined'
  ansible.builtin.fail:
    msg: "ERPNext install cannot proceed, as Node.js is not installed."
  when: nodejs_installed is undefined

- name: Record (initial) disk space used
  ansible.builtin.shell: df -B1 --output=used / | tail -1
  register: df1
  changed_when: false

- name: Install ERPNext system dependencies
  ansible.builtin.apt:
    name:
      - redis-server
      - python3-pip
      - python3-venv
      - libmysqlclient-dev
      - python3-dev
      - pkg-config
      - pipx
      - curl
      - git
    state: present
  when: erpnext_enabled | bool

# wkhtmltopdf renders PDFs (invoices, POS receipts). Ubuntu 24.10+ and Debian 13 dropped the
# package, so the OS repository is tried first and the upstream wkhtmltox build for jammy
# second (it installs cleanly on 26.04: its libssl3 dependency is provided by libssl3t64).
# Without either, the install goes on and PDF printing stays unavailable until one is added.
- name: Does the OS repository offer wkhtmltopdf?
  ansible.builtin.shell: "apt-cache policy wkhtmltopdf | grep -q 'Candidate: [0-9]'"
  register: wkhtmltopdf_apt
  failed_when: false
  changed_when: false
  when: erpnext_enabled | bool

- name: Install wkhtmltopdf from the OS repository
  ansible.builtin.apt:
    name: wkhtmltopdf
    state: present
  when: erpnext_enabled | bool and wkhtmltopdf_apt.rc == 0

- name: Install wkhtmltopdf from the upstream wkhtmltox release (no OS package)
  when: erpnext_enabled | bool and wkhtmltopdf_apt.rc != 0

  block:
    - name: Read the package architecture (bare ansible_* facts are undefined in role runs)
      ansible.builtin.command: dpkg --print-architecture
      register: wkhtmltox_arch
      changed_when: false

    - name: Download wkhtmltox {{ wkhtmltox_version }} for {{ wkhtmltox_arch.stdout }}
      ansible.builtin.get_url:
        url: "https://github.com/wkhtmltopdf/packaging/releases/download/{{ wkhtmltox_version }}/wkhtmltox_{{ wkhtmltox_version }}.jammy_{{ wkhtmltox_arch.stdout }}.deb"
        dest: /tmp/wkhtmltox.deb
        mode: "0644"
        timeout: 120

    - name: Install the wkhtmltox package (apt resolves its dependencies)
      ansible.builtin.apt:
        deb: /tmp/wkhtmltox.deb
  rescue:
    - name: wkhtmltopdf could not be installed on this OS
      ansible.builtin.debug:
        msg: "wkhtmltopdf is unavailable here: PDF printing (invoices, receipts) will not work until it is installed by hand. The ERPNext install continues."
- name: Ensure git-hooks directory exists in /etc
  ansible.builtin.file:
    path: /etc/git-hooks
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: erpnext_enabled | bool

- name: Deploy system-wide secure git hooks (PAT leak prevention)
  ansible.builtin.copy:
    src: "git-hooks/{{ item }}"
    dest: "/etc/git-hooks/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - pre-commit
    - post-commit
    - pre-push
    - README.md
  when: erpnext_enabled | bool

- name: Configure system-wide core.hooksPath
  ansible.builtin.shell: '[ "$(git config --system --get core.hooksPath)" = /etc/git-hooks ] || { git config --system core.hooksPath /etc/git-hooks && echo set; }'
  when: erpnext_enabled | bool
  register: erpnext_hookspath
  changed_when: "'set' in erpnext_hookspath.stdout"

- name: Install yarn globally via npm
  community.general.npm:
    name: yarn
    global: true
    state: present
  when: erpnext_enabled | bool

- name: Ensure vm.overcommit_memory=1 persists across reboots (Redis requirement)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-iiab-erpnext-redis.conf
    content: "vm.overcommit_memory=1\n"
    mode: "0644"
  become: true
  when: erpnext_enabled | bool

- name: Apply vm.overcommit_memory=1 immediately (no module, no deprecation)
  ansible.builtin.command: sysctl -w vm.overcommit_memory=1
  become: true
  changed_when: false
  when: erpnext_enabled | bool

- name: Configure MariaDB for ERPNext
  ansible.builtin.template:
    src: erpnext-mysqld.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-erpnext.cnf
  notify: restart mariadb
  when: erpnext_enabled | bool

- name: Create frappe user
  ansible.builtin.user:
    name: "{{ erpnext_user_name }}"
    shell: /bin/bash
    home: /home/{{ erpnext_user_name }}
    groups: www-data
    append: true
  when: erpnext_enabled | bool

- name: Ensure pipx is installed and in path for frappe user
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: pipx ensurepath
  args:
    creates: /home/{{ erpnext_user_name }}/.local/bin
  when: erpnext_enabled | bool

- name: Install frappe-bench globally for frappe user
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: pipx install frappe-bench
  args:
    creates: /home/{{ erpnext_user_name }}/.local/bin/bench
  when: erpnext_enabled | bool

- name: Install uv via pipx for frappe user (required by modern bench init)
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: pipx install uv
  args:
    creates: /home/{{ erpnext_user_name }}/.local/bin/uv
  when: erpnext_enabled | bool

# frappe-bench unconditionally calls `sudo supervisorctl status` during
# bench init / get-app.  Without supervisor + passwordless sudo, the
# entire ERPNext installation crashes.
- name: Install supervisor (required by frappe-bench tool)
  ansible.builtin.apt:
    name: supervisor
    state: present
  when: erpnext_enabled | bool

- name: Ensure supervisor is running
  ansible.builtin.systemd:
    name: supervisor
    state: started
    enabled: true
  when: erpnext_enabled | bool

- name: Make yarn resilient to slow registries (bench app installs pull hundreds of tarballs)
  ansible.builtin.copy:
    dest: "/home/{{ erpnext_user_name }}/.yarnrc"
    content: |
      network-timeout 600000
      network-concurrency 4
    owner: "{{ erpnext_user_name }}"
    group: "{{ erpnext_user_name }}"
    mode: "0644"
  when: erpnext_enabled | bool

# systemctl is limited to the bench's own targets, each spelled out: an unrestricted systemctl is
# root, and sudo-rs (the default sudo since Ubuntu 26.04) refuses wildcards in command arguments.
- name: Grant frappe user passwordless sudo for bench tooling
  ansible.builtin.copy:
    dest: /etc/sudoers.d/frappe
    content: |
      {% set cmds = ['/usr/bin/systemctl daemon-reload'] %}
      {% for unit in ['frappe-bench.target', 'frappe-bench-web.target', 'frappe-bench-workers.target', 'frappe-bench-redis.target'] %}
      {% for verb in ['start', 'stop', 'restart', 'reload', 'status'] %}
      {% set _ = cmds.append('/usr/bin/systemctl ' ~ verb ~ ' ' ~ unit) %}
      {% endfor %}
      {% endfor %}
      Cmnd_Alias BENCH_UNITS = {{ cmds | join(', ') }}
      {{ erpnext_user_name }} ALL=(ALL) NOPASSWD: /usr/bin/supervisorctl
      {{ erpnext_user_name }} ALL=(ALL) NOPASSWD: /usr/sbin/nginx
      {{ erpnext_user_name }} ALL=(ALL) NOPASSWD: BENCH_UNITS
    mode: "0440"
    validate: "visudo -cf %s"
  when: erpnext_enabled | bool

- name: Instruct uv to fetch specific Python version if needed
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: ~/.local/bin/uv python install 3.14
  args:
    creates: /home/{{ erpnext_user_name }}/.local/share/uv/python
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when:
    - erpnext_enabled | bool
    - erpnext_version == 'develop'

# Clean up partial bench directory from a previously failed init.
# Without this, the 'creates:' guard skips re-init and the install
# is stuck with a broken bench forever.
- name: Check if frappe-bench exists but is incomplete (missing frappe app or venv)
  ansible.builtin.shell: |
    test -d /home/{{ erpnext_user_name }}/frappe-bench || exit 0
    test -f /home/{{ erpnext_user_name }}/frappe-bench/apps/frappe/pyproject.toml && \
    test -f /home/{{ erpnext_user_name }}/frappe-bench/env/bin/python && \
    echo "COMPLETE" || echo "INCOMPLETE"
  register: bench_completeness
  changed_when: false
  when: erpnext_enabled | bool

- name: Remove incomplete frappe-bench directory from a previous failed init
  ansible.builtin.file:
    path: /home/{{ erpnext_user_name }}/frappe-bench
    state: absent
  when:
    - erpnext_enabled | bool
    - bench_completeness.stdout is defined
    - bench_completeness.stdout == "INCOMPLETE"

- name: Init frappe bench
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: ~/.local/bin/bench init frappe-bench --frappe-path https://github.com/deldesir/frappe.git --frappe-branch {{ erpnext_version }} {% if erpnext_version == 'develop' %}--python 3.14{% endif %}
  args:
    chdir: /home/{{ erpnext_user_name }}
    creates: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool

# The get-app tasks below use `creates:` guards, so a FAILED get-app (e.g. a
# yarn network timeout) leaves a partial apps/<name> dir that skips forever.
# An app is only truly installed once bench records it in sites/apps.txt.
- name: Remove partially-installed bench apps (on disk but absent from apps.txt)
  ansible.builtin.shell: |
    [ -f /home/{{ erpnext_user_name }}/frappe-bench/sites/apps.txt ] || exit 0
    for d in /home/{{ erpnext_user_name }}/frappe-bench/apps/*/; do
      app=$(basename "$d")
      grep -qx "$app" /home/{{ erpnext_user_name }}/frappe-bench/sites/apps.txt || rm -rf "$d"
    done
  args:
    executable: /bin/bash
  changed_when: false
  when: erpnext_enabled | bool

- name: Install ERPNext app in bench
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: ~/.local/bin/bench get-app https://github.com/deldesir/erpnext.git --branch {{ erpnext_version }}
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
    creates: /home/{{ erpnext_user_name }}/frappe-bench/apps/erpnext
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool

- name: Install extra Frappe apps in bench (HR, CRM, etc.)
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: ~/.local/bin/bench get-app {{ item.name }} --branch {{ item.branch }}
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
    creates: /home/{{ erpnext_user_name }}/frappe-bench/apps/{{ item.app_name }}
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  loop: "{{ erpnext_extra_apps }}"
  when: erpnext_enabled | bool

# NOTE: Services are stopped by the pre-build block below (line ~459), which runs
# on every install/reinstall.  No separate stop needed here.

- name: Check if site config exists
  ansible.builtin.stat:
    path: /home/{{ erpnext_user_name }}/frappe-bench/sites/{{ erpnext_site_name }}/site_config.json
  register: site_config

# DB drop is destructive — only triggered by explicit erpnext_force_drop_db flag,
# OR if the database is orphaned (when site_config.json is completely missing after a folder purge).
- name: Drop ERPNext DB (ONLY when erpnext_force_drop_db is set or database is orphaned)
  ansible.mysql.mysql_db:
    name: "{{ erpnext_db_name }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  when: >
    erpnext_enabled | bool and (
    (erpnext_force_drop_db | default(False) | bool) or
    (not site_config.stat.exists)
    )

- name: Drop ERPNext Site Directory (ONLY when erpnext_force_drop_db is set or site config is missing)
  ansible.builtin.file:
    path: /home/{{ erpnext_user_name }}/frappe-bench/sites/{{ erpnext_site_name }}
    state: absent
  when: >
    erpnext_enabled | bool and (
    (erpnext_force_drop_db | default(False) | bool) or
    (not site_config.stat.exists)
    )

- name: Flush Redis cache + queue (eliminates stale assets_json, doctype_meta, boot data)
  ansible.builtin.command: redis-cli -p {{ item }} FLUSHDB
  loop:
    - 13000
    - 11000
  ignore_errors: true
  when: erpnext_enabled | bool
  changed_when: true   # always flushes

- name: Ensure correct ownership of Frappe apps directory (prevents permission errors on code pull)
  ansible.builtin.command: chown -Rc {{ erpnext_user_name }}:{{ erpnext_user_name }} /home/{{ erpnext_user_name }}/frappe-bench/apps
  when: erpnext_enabled | bool
  register: erpnext_apps_chown
  changed_when: erpnext_apps_chown.stdout | length > 0

- name: Pull latest code from fork for frappe/erpnext
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    if git remote | grep -q "^origin$"; then
        REMOTE="origin"
    else
        REMOTE=$(git config branch.$(git rev-parse --abbrev-ref HEAD).remote || echo "")
        if [ -z "$REMOTE" ] || ! git remote | grep -q "^$REMOTE$"; then
            REMOTE=$(git remote | head -n 1)
        fi
    fi
    BRANCH=$(git rev-parse --abbrev-ref HEAD)
    OLD=$(git rev-parse HEAD)
    if [ -n "$REMOTE" ] && [ -n "$BRANCH" ]; then
        [ -f .git/shallow ] && git fetch --unshallow $REMOTE $BRANCH 2>/dev/null || git fetch $REMOTE $BRANCH
        git reset --hard $REMOTE/$BRANCH
    fi
    [ "$OLD" = "$(git rev-parse HEAD)" ] || echo "UPDATED to $(git rev-parse --short HEAD)"
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench/apps/{{ item }}
  loop:
    - frappe
    - erpnext
  when: erpnext_enabled | bool
  ignore_errors: true
  register: erpnext_core_pull
  changed_when: "'UPDATED' in erpnext_core_pull.stdout"

- name: Pull latest code from fork for extra apps
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    if git remote | grep -q "^origin$"; then
        REMOTE="origin"
    else
        REMOTE=$(git config branch.$(git rev-parse --abbrev-ref HEAD).remote || echo "")
        if [ -z "$REMOTE" ] || ! git remote | grep -q "^$REMOTE$"; then
            REMOTE=$(git remote | head -n 1)
        fi
    fi
    BRANCH=$(git rev-parse --abbrev-ref HEAD)
    OLD=$(git rev-parse HEAD)
    if [ -n "$REMOTE" ] && [ -n "$BRANCH" ]; then
        [ -f .git/shallow ] && git fetch --unshallow $REMOTE $BRANCH 2>/dev/null || git fetch $REMOTE $BRANCH
        git reset --hard $REMOTE/$BRANCH
    fi
    [ "$OLD" = "$(git rev-parse HEAD)" ] || echo "UPDATED to $(git rev-parse --short HEAD)"
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench/apps/{{ item.app_name }}
  loop: "{{ erpnext_extra_apps }}"
  when: erpnext_enabled | bool
  ignore_errors: true
  register: erpnext_extra_pull
  changed_when: "'UPDATED' in erpnext_extra_pull.stdout"

- name: Update Python/Node dependencies after code pull (prevents ImportError on new packages)
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: ~/.local/bin/bench setup requirements
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    CYPRESS_INSTALL_BINARY: "0"
  when: erpnext_enabled | bool
  ignore_errors: true
  changed_when: true   # reinstalls the Python and Node requirements on every run

- name: Wipe compiled JS/CSS bundles (forces clean bench build, avoids stale hashes)
  ansible.builtin.shell: |
    rm -rf /home/{{ erpnext_user_name }}/frappe-bench/sites/assets/*/dist
    rm -f  /home/{{ erpnext_user_name }}/frappe-bench/sites/assets/assets.json
    rm -f  /home/{{ erpnext_user_name }}/frappe-bench/sites/assets/assets-rtl.json
  when: erpnext_enabled | bool
  changed_when: true   # always wipes; the build flag below checks the assets file this removes, so every run rebuilds

- name: Create ERPNext database
  ansible.mysql.mysql_db:
    name: "{{ erpnext_db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  when: erpnext_enabled | bool

- name: Create ERPNext database user
  ansible.mysql.mysql_user:
    name: "{{ erpnext_db_user }}"
    password: "{{ erpnext_db_password }}"
    priv: "{{ erpnext_db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  when: erpnext_enabled | bool

- name: Create ERPNext Site
  become: true
  become_user: "{{ erpnext_user_name }}"
  no_log: true # the command line carries the admin and database passwords
  ansible.builtin.command: ~/.local/bin/bench new-site {{ erpnext_site_name }} --admin-password {{ erpnext_admin_password }} --db-name {{ erpnext_db_name }} --db-password {{ erpnext_db_password }} --no-setup-db --force
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
    creates: /home/{{ erpnext_user_name }}/frappe-bench/sites/{{ erpnext_site_name }}/site_config.json
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool

- name: Ensure site_config.json has the correct database password (prevents Access Denied if password changed in local_vars.yml)
  no_log: true # the inline script carries the database password
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    python3 -c "
    import json
    path = '/home/{{ erpnext_user_name }}/frappe-bench/sites/{{ erpnext_site_name }}/site_config.json'
    try:
        with open(path, 'r') as f:
            data = json.load(f)
        if data.get('db_password') != '{{ erpnext_db_password }}':
            data['db_password'] = '{{ erpnext_db_password }}'
            with open(path, 'w') as f:
                json.dump(data, f, indent=1)
            print('UPDATED PASSWORD')
    except Exception as e:
        print(f'ERROR: {e}')
    "
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  when: erpnext_enabled | bool
  register: erpnext_site_db_password
  changed_when: "'UPDATED PASSWORD' in erpnext_site_db_password.stdout"
  failed_when: "'ERROR' in erpnext_site_db_password.stdout"

- name: Ensure currentsite.txt exists (Frappe needs this to resolve the active site)
  ansible.builtin.copy:
    content: "{{ erpnext_site_name }}\n"
    dest: /home/{{ erpnext_user_name }}/frappe-bench/sites/currentsite.txt
    owner: "{{ erpnext_user_name }}"
    group: "{{ erpnext_user_name }}"
    mode: "0644"
    force: false
  when: erpnext_enabled | bool

- name: Set site host_name for IIAB subpath
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json, subprocess
    path = 'sites/{{ erpnext_site_name }}/site_config.json'
    want = '{{ erpnext_host_name }}'
    if json.load(open(path)).get('host_name') != want:
        subprocess.run(['/home/{{ erpnext_user_name }}/.local/bin/bench', '--site', '{{ erpnext_site_name }}', 'set-config', 'host_name', want], check=True)
        print('UPDATED host_name')
    PY
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool
  register: erpnext_host_name_cfg
  changed_when: "'UPDATED' in erpnext_host_name_cfg.stdout"

- name: Generate Systemd Services (replaces Supervisor)
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    before=$(cat config/systemd/* 2>/dev/null | sha256sum)
    yes | ~/.local/bin/bench setup systemd
    [ "$before" = "$(cat config/systemd/* | sha256sum)" ] || echo "UNITS CHANGED"
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool
  register: erpnext_systemd_units
  changed_when: "'UNITS CHANGED' in erpnext_systemd_units.stdout"

- name: Increase gunicorn worker timeout to 300s (setup_wizard.setup_complete needs >120s)
  ansible.builtin.replace:
    path: /home/{{ erpnext_user_name }}/frappe-bench/config/systemd/frappe-bench-frappe-web.service
    regexp: "-t \\d+"
    replace: "-t 300"
  when: erpnext_enabled | bool

- name: Set gunicorn workers to (2 * CPU cores) + 1 for optimal concurrency
  ansible.builtin.replace:
    path: /home/{{ erpnext_user_name }}/frappe-bench/config/systemd/frappe-bench-frappe-web.service
    regexp: "-w \\d+"
    replace: "-w {{ (2 * (ansible_processor_vcpus | default(2) | int)) + 1 }}"
  when: erpnext_enabled | bool

- name: Fix bench setup systemd bug (ExecStart=None in worker/scheduler services)
  ansible.builtin.replace:
    path: "/home/{{ erpnext_user_name }}/frappe-bench/config/systemd/{{ item }}"
    regexp: "ExecStart=None "
    replace: "ExecStart=/home/{{ erpnext_user_name }}/.local/bin/bench "
  loop:
    - frappe-bench-frappe-schedule.service
    - frappe-bench-frappe-default-worker@.service
    - frappe-bench-frappe-short-worker@.service
    - frappe-bench-frappe-long-worker@.service
  when: erpnext_enabled | bool

- name: Setup Systemd Symlinks
  ansible.builtin.shell: |
    links() { find /etc/systemd/system -maxdepth 1 -name 'frappe-bench*' -printf '%p %l\n' | sort | sha256sum; }
    before=$(links)
    ln -sf /home/{{ erpnext_user_name }}/frappe-bench/config/systemd/* /etc/systemd/system/
    systemctl daemon-reload
    [ "$before" = "$(links)" ] || echo "RELINKED"
  when: erpnext_enabled | bool
  register: erpnext_systemd_links
  changed_when: "'RELINKED' in erpnext_systemd_links.stdout"

- name: Start Bench Redis Services (required for install-app and migrate)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - frappe-bench-redis-cache.service
    - frappe-bench-redis-queue.service
  when: erpnext_enabled | bool

# Check which apps are already installed in the site to avoid
# "App already installed" errors on crash-and-resume re-runs.
- name: Get list of apps already installed in site
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: ~/.local/bin/bench --site {{ erpnext_site_name }} list-apps 2>/dev/null | grep -v '^$' || true
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: _installed_apps
  changed_when: false
  when: erpnext_enabled | bool

- name: Install ERPNext App in Site
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: >-
    ~/.local/bin/bench --site {{ erpnext_site_name }} install-app erpnext
    {{ '--force' if (erpnext_force_drop_db | default(False) | bool) else '' }}
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when:
    - erpnext_enabled | bool
    - "'erpnext' not in (_installed_apps.stdout | default(''))"
  changed_when: true   # runs only when the app is not in the site

- name: Install extra apps in site (HR, CRM, etc.)
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.command: >-
    ~/.local/bin/bench --site {{ erpnext_site_name }} install-app {{ item.app_name }}
    {{ '--force' if (erpnext_force_drop_db | default(False) | bool) else '' }}
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  loop: "{{ erpnext_extra_apps }}"
  when:
    - erpnext_enabled | bool
    - "item.app_name not in (_installed_apps.stdout | default(''))"
  changed_when: true   # same

- name: Run migrate + clear-cache after all apps installed
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: |
    ~/.local/bin/bench --site {{ erpnext_site_name }} migrate
    ~/.local/bin/bench --site {{ erpnext_site_name }} clear-cache
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool
  changed_when: true   # runs on every update; bench does not report whether a patch ran

# NOTE: Do NOT set home_page to 'shop' at install time.
# On a fresh site the setup wizard hasn't run yet, so the shop page will
# crash with a 500 (no Company, no Item Groups). Frappe's built-in logic
# auto-redirects to the setup wizard when the default home page is used.
# Set home_page to 'shop' only AFTER the setup wizard has been completed,
# either manually or via a post-setup hook.

- name: Enable scheduler for the site
  become: true
  become_user: "{{ erpnext_user_name }}"
  ansible.builtin.shell: ~/.local/bin/bench --site {{ erpnext_site_name }} scheduler status | grep -q 'is enabled' || { ~/.local/bin/bench --site {{ erpnext_site_name }} scheduler enable && echo ENABLED; }
  args:
    chdir: /home/{{ erpnext_user_name }}/frappe-bench
  environment:
    PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: erpnext_enabled | bool
  register: erpnext_scheduler
  changed_when: "'ENABLED' in erpnext_scheduler.stdout"

- name: Enable ERPNext Systemd Targets (web + workers)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - frappe-bench.target
    - frappe-bench-workers.target
  when: erpnext_enabled | bool

- name: Grant Nginx access to Frappe static assets
  ansible.builtin.shell: chmod -c a+x /home/{{ erpnext_user_name }} /home/{{ erpnext_user_name }}/frappe-bench && chmod -Rc a+rX /home/{{ erpnext_user_name }}/frappe-bench/sites
  when: erpnext_enabled | bool
  register: erpnext_static_perms
  changed_when: erpnext_static_perms.stdout | length > 0

- name: Ensure Nginx knows the client's scheme behind a TLS-terminating proxy ($fwd_proto map in the http context; boxes whose nginx.conf predates it)
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: "^\\s*map \\$http_x_forwarded_proto \\$fwd_proto"
    line: "    map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }"
    insertafter: "^http \\{"
  when: erpnext_enabled | bool

- name: Configure IIAB Nginx Sub-Path Proxy for ERPNext
  ansible.builtin.template:
    src: erpnext-nginx.conf.j2
    dest: /etc/nginx/conf.d/erpnext-nginx.conf
  notify:
    - restart nginx
  when: erpnext_enabled | bool

# ── NOTE: IIAB subpath patches are now baked into deldesir/* forks ──────────────
# frappe JS patches  → deldesir/frappe   (version-16 branch)
# ERPNext POS patches → deldesir/erpnext (version-16 branch)
# HRMS roster patch   → deldesir/hrms    (version-16 branch)
# CRM demo + router   → deldesir/crm     (main branch)
# Builder patches     → deldesir/builder (develop branch)
# Historical patch files are archived in files/archive/

# ── Determine whether a full build is needed ──────────────────────────────────
# On a repeat runrole (no --reinstall), skip the expensive build+restart cycle
# if assets are already built.  This avoids 15-45 min of downtime + session
# destruction for a "just enforce enabled" re-run.
- name: Check if JS assets are already built
  ansible.builtin.stat:
    path: /home/{{ erpnext_user_name }}/frappe-bench/sites/assets/assets.json
  register: _assets_json
  when: erpnext_enabled | bool

- name: Set _needs_build flag
  ansible.builtin.set_fact:
    _needs_build: "{{ reinstall | default(False) | bool or erpnext_force_rebuild | default(False) | bool or not (_assets_json.stat.exists | default(false)) or erpnext_installed is undefined }}"

# ── Stop ALL services before build ─────────────────────────────────────────────
# 1) Frees ~900 MB of RAM held by gunicorn workers + background jobs, which is
#    critical for CRM's heavy Vite/Rollup build on low-RAM deployments.
# 2) gunicorn --preload forks workers from a master that loads all Python modules
#    at startup.  Workers that preloaded before patches/installs will serve stale
#    code and crash on missing modules (e.g. hrms, crm).  Killing every process
#    guarantees a clean slate when we restart after the build.
# NOTE: We stop individual services explicitly because systemd targets with
# Wants= do NOT propagate stop/start to already-running member services.
- name: Stop Frappe services before build (kill stale gunicorn workers + free RAM)
  ansible.builtin.shell: |
    systemctl stop frappe-bench-frappe-web.service \
                   frappe-bench-node-socketio.service \
                   frappe-bench-frappe-schedule.service \
                   'frappe-bench-frappe-default-worker@*.service' \
                   'frappe-bench-frappe-short-worker@*.service' \
                   'frappe-bench-frappe-long-worker@*.service' \
                   frappe-bench.target 2>/dev/null || true
  when: erpnext_enabled | bool and _needs_build | bool
  changed_when: true   # runs only when a build follows

- name: Flush Redis caches before build (clear stale boot data and asset references)
  ansible.builtin.command: redis-cli -p {{ item }} FLUSHDB
  loop:
    - 13000
    - 11000
  ignore_errors: true
  when: erpnext_enabled | bool and _needs_build | bool
  changed_when: true   # same

# ── Build JS bundles with temporary swap ───────────────────────────────────────
# CRM's Vite/Rollup build needs 4-6 GB during its "rendering chunks" phase.
# On systems where other services consume 5+ GB, the build is OOM-killed (exit
# 137) even with Frappe services stopped.  A temporary 4 GB swapfile on /var/tmp
# (never tmpfs, guaranteed on-disk) provides overflow headroom.
# The block/always structure guarantees the swapfile is cleaned up even if the
# build fails.
- when: erpnext_enabled | bool and _needs_build | bool

  # ── Start services with clean workers ──────────────────────────────────────────
  # Restart (not just start) every service explicitly to guarantee gunicorn
  # preloads the freshly-built code.  A simple 'start frappe-bench.target'
  # would skip services that systemd considers "already active" from before
  # the stop, leaving stale workers that crash on missing modules (hrms, crm).
  block:
    - name: Create temporary 4 GB swapfile for Vite build
      ansible.builtin.shell: |
        SWAPFILE=/var/tmp/.erpnext_build_swap
        if [ ! -f "$SWAPFILE" ]; then
          fallocate -l 4G "$SWAPFILE" 2>/dev/null || \
            dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096 status=none
          chmod 600 "$SWAPFILE"
          mkswap "$SWAPFILE" >/dev/null
          swapon "$SWAPFILE"
          echo "SWAP CREATED"
        fi
      register: erpnext_build_swap
      changed_when: "'SWAP CREATED' in erpnext_build_swap.stdout"
    - name: Rebuild all JS bundles (unified assets.json)
      ansible.builtin.shell: |
        /home/{{ erpnext_user_name }}/.local/bin/bench build
      args:
        chdir: "/home/{{ erpnext_user_name }}/frappe-bench"
      become: true
      become_user: "{{ erpnext_user_name }}"
      environment:
        PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      changed_when: true   # the block runs only when a build is due

    - name: Rebuild Builder Frontend (Vite — separate from bench build)
      ansible.builtin.shell: |
        yarn install
        yarn build
      args:
        chdir: "/home/{{ erpnext_user_name }}/frappe-bench/apps/builder/frontend"
      become: true
      become_user: "{{ erpnext_user_name }}"
      when: erpnext_enabled | bool
      ignore_errors: true
      changed_when: true   # same

    - name: Deploy IIAB asset patching script
      ansible.builtin.template:
        src: patch_erpnext_assets.py.j2
        dest: /home/{{ erpnext_user_name }}/frappe-bench/patch_erpnext_assets.py
        owner: "{{ erpnext_user_name }}"
        group: "{{ erpnext_user_name }}"
        mode: "0755"
      when: erpnext_enabled | bool

    - name: Run IIAB asset patching script (idempotent subpath fix for compiled artifacts)
      ansible.builtin.command: python3 /home/{{ erpnext_user_name }}/frappe-bench/patch_erpnext_assets.py
      args:
        chdir: /home/{{ erpnext_user_name }}/frappe-bench
      become: true
      become_user: "{{ erpnext_user_name }}"
      when: erpnext_enabled | bool
      register: erpnext_assets_patch
      changed_when: "'Patching /' in erpnext_assets_patch.stdout"

    - name: Deploy IIAB About page translation and custom styling script
      ansible.builtin.template:
        src: update_about_page.py.j2
        dest: /home/{{ erpnext_user_name }}/frappe-bench/update_about_page.py
        owner: "{{ erpnext_user_name }}"
        group: "{{ erpnext_user_name }}"
        mode: "0755"
      when: erpnext_enabled | bool

    - name: Run IIAB About page translation and custom styling script
      become: true
      become_user: "{{ erpnext_user_name }}"
      ansible.builtin.shell: |
        ~/.local/bin/bench --site {{ erpnext_site_name }} execute "exec('import sys; sys.path.insert(0, \"/home/{{ erpnext_user_name }}/frappe-bench\"); import update_about_page; update_about_page.run()')"
      args:
        chdir: /home/{{ erpnext_user_name }}/frappe-bench
      environment:
        PATH: "/home/{{ erpnext_user_name }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      when: erpnext_enabled | bool
      changed_when: true   # rewrites the settings on every build

  always:
    - name: Remove temporary swapfile after build
      ansible.builtin.shell: |
        SWAPFILE=/var/tmp/.erpnext_build_swap
        if [ -f "$SWAPFILE" ]; then
          swapoff "$SWAPFILE" 2>/dev/null || true
          rm -f "$SWAPFILE"
          echo "SWAP REMOVED"
        fi
      register: erpnext_build_swap_removed
      changed_when: "'SWAP REMOVED' in erpnext_build_swap_removed.stdout"
- name: Start Frappe services with fresh workers (all apps loaded cleanly)
  ansible.builtin.shell: |
    systemctl restart frappe-bench.target \
                      frappe-bench-frappe-web.service \
                      frappe-bench-node-socketio.service \
                      frappe-bench-frappe-schedule.service
    systemctl restart 'frappe-bench-frappe-default-worker@*.service' \
                      'frappe-bench-frappe-short-worker@*.service' \
                      'frappe-bench-frappe-long-worker@*.service' 2>/dev/null || true
  when: erpnext_enabled | bool and _needs_build | bool
  changed_when: true   # runs only after a build

- name: Ensure Frappe services are running (no-build re-run)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - frappe-bench.target
    - frappe-bench-frappe-web.service
    - frappe-bench-node-socketio.service
    - frappe-bench-frappe-schedule.service
  when: erpnext_enabled | bool and not (_needs_build | bool)

- name: Record (final) disk space used
  ansible.builtin.shell: df -B1 --output=used / | tail -1
  register: df2
  changed_when: false

- name: Add 'erpnext_disk_usage' delta to iiab.ini
  community.general.ini_file:
    path: /etc/iiab/iiab.ini
    section: erpnext
    option: erpnext_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'erpnext_installed: True'"
  ansible.builtin.set_fact:
    erpnext_installed: true

- name: "Add 'erpnext_installed: True' to /etc/iiab/iiab_state.yml"
  ansible.builtin.lineinfile:
    path: /etc/iiab/iiab_state.yml
    regexp: "^erpnext_installed"
    line: "erpnext_installed: True"
