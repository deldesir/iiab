---
- name: Enable & Restart 'anki' systemd service, if anki_enabled
  ansible.builtin.systemd:
    name: anki
    daemon_reload: true
    enabled: true
    state: restarted
  when: anki_enabled

- name: Disable & Stop 'anki' systemd service, if not anki_enabled
  ansible.builtin.systemd:
    name: anki
    enabled: false
    state: stopped
  when: not anki_enabled

- name: Enable the NGINX site for anki from the template, installing anki-nginx.conf in {{ nginx_conf_dir }}
  ansible.builtin.template:
    src: anki-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/anki-nginx.conf" # /etc/nginx/conf.d
  when: anki_enabled

- name: Disable the NGINX site for anki by removing anki-nginx.conf from {{ nginx_conf_dir }}
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/anki-nginx.conf" # /etc/nginx/conf.d
    state: absent
  when: not anki_enabled

- name: Restart 'nginx' systemd service
  ansible.builtin.systemd:
    name: nginx
    state: restarted
