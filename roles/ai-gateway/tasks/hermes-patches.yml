---
# IIAB local patches on the hermes-agent library, applied at install and after every move of
# the tree (tasks/update.yml). Same pattern as the flow engine's configure.yml: replace with
# ignore_errors, then an end-state check that fails loudly.

# Patch 1: Tenant-scoped memory isolation via contextvars
# Reason: Multi-tenant WhatsApp deployments need per-user memory dirs
- name: "Hermes patch: tenant memory isolation"
  ansible.builtin.replace:
    path: "{{ ai_gateway_hermes_dir }}/tools/memory_tool.py"
    regexp: |
      def get_memory_dir\(\) -> Path:
          """[^"\n]*"""
          return get_hermes_home\(\) / "memories"
    replace: |
      import contextvars

      # IIAB: tenant isolation for multi-user WhatsApp deployments
      current_tenant_urn: contextvars.ContextVar[str] = contextvars.ContextVar("current_tenant_urn", default="")

      def get_memory_dir() -> Path:
          """Return the profile-scoped memories directory.
          If current_tenant_urn is set, isolates memories per-user."""
          base = get_hermes_home() / "memories"
          urn = current_tenant_urn.get()
          if urn:
              user_digits = urn.split(":")[-1].lstrip("+")
              return base / f"user_{user_digits}"
          return base
  become: true
  register: patch_tenant
  ignore_errors: true

- name: "⚠️  tenant isolation patch did not apply"
  ansible.builtin.debug:
    msg: "Hermes tenant isolation patch FAILED — upstream may have refactored memory_tool.py"
  when: patch_tenant is failed

# Patch 2: 4KB USER.md storage cap
# Reason: Prevent token exhaustion from unbounded user memory growth
- name: "Hermes patch: 4KB USER.md storage cap"
  ansible.builtin.replace:
    # upstream moved MemoryStore (and its limit getter) out of memory_tool.py
    path: "{{ ai_gateway_hermes_dir }}/tools/memory_tool_store.py"
    regexp: 'return self\.user_char_limit if target == "user" else self\.memory_char_limit'
    replace: 'return 4096 if target == "user" else self.memory_char_limit  # IIAB: storage cap for multi-tenant'
  become: true
  register: patch_cap
  ignore_errors: true

- name: "⚠️  storage cap patch did not apply"
  ansible.builtin.debug:
    msg: "Hermes 4KB storage cap patch FAILED — check tools/memory_tool_store.py"
  when: patch_cap is failed

# Patch 3: _SafeWriter must be weakref-able
# Reason: _install_safe_stdio() wraps sys.stdout/stderr in _SafeWriter before
# most libraries import. structlog's WRITE_LOCKS (structlog/_output.py) is a
# WeakKeyDictionary keyed by the stream object, so any structlog logger then
# dies with "cannot create weak reference to '_SafeWriter' object" (seen as
# create_revision canvas builds failing in the gateway). A slotted class is
# only weakref-able if __slots__ includes __weakref__.
- name: "Hermes patch: _SafeWriter weakref slot (structlog compatibility)"
  ansible.builtin.replace:
    path: "{{ ai_gateway_hermes_dir }}/agent/process_bootstrap.py"
    regexp: '__slots__ = \("_inner",\)'
    replace: '__slots__ = ("_inner", "__weakref__")  # IIAB: weakref-able for structlog WRITE_LOCKS'
  become: true
  register: patch_safewriter
  ignore_errors: true

- name: "⚠️  _SafeWriter weakref patch did not apply"
  ansible.builtin.debug:
    msg: "Hermes _SafeWriter weakref patch FAILED — check agent/process_bootstrap.py"
  when: patch_safewriter is failed

# The `replace` module reports "ok" when its regexp matches NOTHING, so the
# `is failed` warnings above cannot catch an upstream refactor that moves an
# anchor. Check the end state instead and stop the play: an agent restarted
# without tenant isolation would share one memory file between every user.
- name: "Hermes patches: verify they are present (fails loudly on a silent miss)"
  ansible.builtin.shell: |
    set -e
    grep -q 'current_tenant_urn' {{ ai_gateway_hermes_dir }}/tools/memory_tool.py \
      || { echo "MISSING: tenant memory isolation (tools/memory_tool.py)"; exit 1; }
    grep -rq 'IIAB: storage cap' {{ ai_gateway_hermes_dir }}/tools/memory_tool.py {{ ai_gateway_hermes_dir }}/tools/memory_tool_store.py 2>/dev/null \
      || { echo "MISSING: USER.md storage cap"; exit 1; }
    grep -q '__weakref__' {{ ai_gateway_hermes_dir }}/agent/process_bootstrap.py \
      || { echo "MISSING: _SafeWriter weakref slot"; exit 1; }
  args:
    executable: /bin/bash
  changed_when: false
  become: true
