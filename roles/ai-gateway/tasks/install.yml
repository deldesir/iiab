---
- name: The model key must be set in local_vars when the gateway is enabled
  ansible.builtin.assert:
    that:
      - ai_gateway_gemini_api_key | default('') | length > 0
    fail_msg: "ai_gateway_gemini_api_key is empty - set it in /etc/iiab/local_vars.yml"
    quiet: true
  when: ai_gateway_enabled | default(false) | bool

- name: Record (initial) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df1
  changed_when: false
  args:
    executable: /bin/bash

- name: Install AI Gateway system dependencies (sqlite3 for the monthly VACUUM of the palace)
  ansible.builtin.apt:
    name:
      - git
      - libpq-dev
      - sqlite3
    state: present
  become: true

- name: Install nginx, which fronts the gateway (roles/nginx, once)
  ansible.builtin.include_role:
    name: nginx

- name: Install the IIAB Postgres cluster the gateway's tables live in (roles/postgresql, once)
  ansible.builtin.include_role:
    name: postgresql
  vars:
    postgresql_install: true
    postgresql_enabled: true

# The service runs from this working tree. A fast-forward to the wanted version is the only
# change the role makes to it: a tree with local modifications stops the role so the operator
# sees them. The libraries (hermes-agent, mempalace, talkmaster, jwlinker) are cloned when
# absent and never touched afterwards; ai-update moves them (tasks/update.yml).
- name: Install the tree, libraries, venv, environment file and units of the AI Gateway (roles/uv-service)
  ansible.builtin.include_role:
    name: uv-service
  vars:
    uv_service: "{{ ai_gateway_service }}"

- name: Apply the IIAB patches on the hermes-agent library
  ansible.builtin.include_tasks: hermes-patches.yml

# Hermes and MemPalace keep their state inside the gateway's data/ directory (IIAB's data-vs-code
# separation; the units point HERMES_HOME and MEMPALACE_PALACE_PATH there).
- name: Ensure AI Gateway data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ai_gateway_user }}"
    group: "{{ ai_gateway_user }}"
    mode: "0755"
  loop:
    - "{{ ai_gateway_dir }}/data/knowledge"
    - "{{ ai_gateway_hermes_home }}"
    - "{{ ai_gateway_mempalace_palace_path }}"
  become: true

- name: Deploy TalkPrep knowledge file
  ansible.builtin.copy:
    src: talkprep-knowledge.md
    dest: "{{ ai_gateway_dir }}/data/knowledge/talkprep.md"
    owner: "{{ ai_gateway_user }}"
    group: "{{ ai_gateway_user }}"
    mode: "0644"
  become: true

# V2: Seed SOUL.md identity file for Hermes Agent (§7.9 of architecture spec).
# Without this, Hermes uses its built-in "coding assistant" identity instead
# of the IIAB-specific WhatsApp assistant identity.
- name: Deploy SOUL.md identity for Hermes Agent
  ansible.builtin.copy:
    src: SOUL.md
    dest: "{{ ai_gateway_hermes_home }}/SOUL.md"
    owner: "{{ ai_gateway_user }}"
    group: "{{ ai_gateway_user }}"
    mode: "0644"
    force: false # Don't overwrite if operator has customized it
  become: true

# ChromaDB keeps the palace's metadata in SQLite (chroma.sqlite3); deletes and updates leave
# dead pages that bloat the file. A monthly VACUUM reclaims them, on the 1st at 03:00, when
# the free space is at least three times the file.
- name: Deploy the monthly VACUUM of the palace's SQLite file
  ansible.builtin.cron:
    name: "mempalace-vacuum"
    minute: "0"
    hour: "3"
    day: "1"
    job: >
      DB={{ ai_gateway_mempalace_palace_path }}/chroma.sqlite3;
      DB_SIZE=$(stat -c%s "$DB" 2>/dev/null || echo 0);
      FREE_SPACE=$(df -k "$(dirname "$DB")" | awk 'NR==2 {print $4 * 1024}');
      [ "$FREE_SPACE" -gt $((DB_SIZE * 3)) ] && sqlite3 "$DB" "VACUUM;" || echo "VACUUM skipped: insufficient space" | logger -t mempalace
    user: "{{ ai_gateway_user }}"
  become: true

- name: Install pipeline maintenance scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - second-brain-backup
    - fleet-backup-mail
    - jwlinker-refresh
    - hermes-elevate
    - pipeline-health-check
  become: true

# TOTP-gated root window for the chat assistant (hermes-elevate).
# Enrollment stays MANUAL and one-time: `hermes-elevate generate` as
# root writes the authenticator secret — the role never creates or
# rotates it.
- name: Allow the gateway user to reach the elevation wrapper
  ansible.builtin.copy:
    content: "iiab-admin ALL=(root) NOPASSWD: /usr/local/sbin/hermes-elevate\n"
    dest: /etc/sudoers.d/hermes-elevate
    mode: "0440"
    validate: "visudo -cf %s"
  become: true

# Emailed Frappe backups run from ONE hub box: the box whose operator wrote
# /etc/iiab/fleet-backup.conf (recipient + box list). Everywhere else the
# script and units are installed but stay dormant.
- name: Is this box the fleet-backup hub?
  ansible.builtin.stat:
    path: /etc/iiab/fleet-backup.conf
  register: fleet_backup_conf

- name: Enable the emailed fleet-backup timers on the hub (the morning run, and the afternoon hub-only retry)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - fleet-backup-mail.timer
    - fleet-backup-mail-hub.timer
  when: fleet_backup_conf.stat.exists
  become: true

# RECORD AI Gateway AS INSTALLED

- name: Record (final) disk space used
  ansible.builtin.shell: set -o pipefail && df -B1 --output=used / | tail -1
  register: df2
  changed_when: false
  args:
    executable: /bin/bash

- name: Add ai_gateway_disk_usage to {{ iiab_ini_file }}
  community.general.ini_file:
    mode: "0644"
    path: "{{ iiab_ini_file }}"
    section: ai-gateway
    option: ai_gateway_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'ai_gateway_installed: True'"
  ansible.builtin.set_fact:
    ai_gateway_installed: true

- name: "Add 'ai_gateway_installed: True' to {{ iiab_state_file }}"
  ansible.builtin.lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: "^ai_gateway_installed"
    line: "ai_gateway_installed: True"
