---
ai_gateway_install: True
ai_gateway_enabled: True

# Install location
ai_gateway_dir: /opt/iiab/ai-gateway

# uv binary path (IIAB Ansible runs as root)
ai_gateway_uv_bin: /usr/local/bin/uv
ai_gateway_python: "3.14"        # the venv's interpreter; changing it recreates the venv on the next run

# Source repository
ai_gateway_repo: "https://github.com/deldesir/gateway.git"
ai_gateway_repo_version: "main"

# systemd MemoryMax for the service (4 GB edge default; raise on bigger boxes)
ai_gateway_memory_max: "800M"

# Wall-clock budget for one chat turn (seconds). Mailroom drops the LLM call at
# 60 s, so the gateway answers honestly before that instead of going silent.
ai_gateway_turn_budget_secs: 45

# Read-only ERPNext view for the operator persona (erpnext_sales_summary).
# Leave the URL empty to disable. Key/secret belong in local_vars.yml.
ai_gateway_erpnext_url: ""
ai_gateway_erpnext_host: ""
ai_gateway_erpnext_api_key: ""
ai_gateway_erpnext_api_secret: ""

# Libraries the gateway imports in-process. Each is an editable path source in the gateway's
# pyproject.toml ([tool.uv.sources]) and is installed by the gateway's own `uv sync`; the role
# clones a library when absent and never touches an existing tree, ai-update moves them with
# the gateway (tasks/update.yml).
ai_gateway_talkmaster_repo: "https://github.com/deldesir/talkmaster.git"
ai_gateway_talkmaster_dir: /opt/iiab/talkmaster
ai_gateway_talkmaster_version: main
ai_gateway_jwlinker_repo: "https://github.com/deldesir/jwlinker.git"
ai_gateway_jwlinker_dir: /opt/iiab/jwlinker
ai_gateway_jwlinker_version: master
# hermes-agent has NO fork commits (the deldesir fork is a stale mirror): the customisations
# are the deploy-time patches in tasks/hermes-patches.yml (tenant isolation, user storage cap,
# _SafeWriter slots; all three verified present at v0.22.3). So the gateway tracks upstream
# directly, PINNED to a release tag. Bump it deliberately after a staged test (scratch gateway
# copy, uv sync against a worktree of the tag with the patches applied, gateway test suite
# green). Upstream re-numbered its tags in 2026-10 (v2026.9.24 → v0.22.x); at v0.22.2 the
# gateway surface was audited compatible: AIAgent kwargs, run_conversation / chat (now on
# agent/turn_facade.py), SessionDB(db_path=), tools.registry.register, the gemini provider and
# the session:compress event. Voice/A2A/MCP2 are optional extras the gateway does NOT install.
ai_gateway_hermes_repo: "https://github.com/nousresearch/hermes-agent.git"
ai_gateway_hermes_dir: /opt/iiab/hermes-agent
ai_gateway_hermes_version: v0.22.3
# The deldesir fork is the integration point: upstream MemPalace is merged INTO it
# deliberately (feature-aware, e.g. the embeddinggemma default is too heavy for 4 GB targets).
ai_gateway_mempalace_repo: "https://github.com/deldesir/mempalace.git"
ai_gateway_mempalace_dir: /opt/iiab/mempalace
ai_gateway_mempalace_version: develop

ai_gateway_libraries:
  - name: hermes-agent
    repo: "{{ ai_gateway_hermes_repo }}"
    dest: "{{ ai_gateway_hermes_dir }}"
    version: "{{ ai_gateway_hermes_version }}"
  - name: mempalace
    repo: "{{ ai_gateway_mempalace_repo }}"
    dest: "{{ ai_gateway_mempalace_dir }}"
    version: "{{ ai_gateway_mempalace_version }}"
  - name: talkmaster
    repo: "{{ ai_gateway_talkmaster_repo }}"
    dest: "{{ ai_gateway_talkmaster_dir }}"
    version: "{{ ai_gateway_talkmaster_version }}"
  - name: jwlinker
    repo: "{{ ai_gateway_jwlinker_repo }}"
    dest: "{{ ai_gateway_jwlinker_dir }}"
    version: "{{ ai_gateway_jwlinker_version }}"

# Service
ai_gateway_port: 8086
ai_gateway_user: "{{ iiab_admin_user }}"

# App entrypoint (uvicorn factory)
ai_gateway_app: "app.api.app:create_app"

# LLM Integration — native Gemini provider.
#
# Default path: the gateway runs Hermes with provider "gemini"
# (GeminiNativeClient → Google AI Studio), which needs only a Gemini API key.
# Set GEMINI_API_KEY once in local_vars (see ai_gateway_gemini_api_key below)
# and the engine auto-selects the native provider.
#
# Custom-endpoint path: leave ai_gateway_gemini_api_key empty and set
# ai_gateway_hermes_provider="" — the engine then falls back to the
# OpenAI-compatible client at ai_gateway_openai_api_base.
ai_gateway_hermes_provider: "{{ 'gemini' if (ai_gateway_gemini_api_key | default('')) else '' }}"
# Set in /etc/iiab/local_vars.yml (secret; defined in exactly one place).
ai_gateway_gemini_api_key: ""   # no default: set it in /etc/iiab/local_vars.yml; the role refuses to run while it is empty
ai_gateway_openai_api_base: "http://localhost:4000"    # any OpenAI-compatible endpoint (fallback path only)
ai_gateway_openai_api_key: "change-me"
ai_gateway_llm_model: "gemini-3.5-flash"
ai_gateway_llm_model_summarize: "gemini-3.5-flash"
ai_gateway_llm_temperature: "0.3"

# Embeddings (#5 — nomic-embed-text-v1.5 is 2x better than MiniLM at same size)
ai_gateway_embedding_provider: "local"
ai_gateway_embedding_model: "nomic-ai/nomic-embed-text-v1.5"
# MemPalace embedding model: 'minilm' (light, English-only) or 'embeddinggemma'
# (multilingual, ~300 MB — memory-heavy; test footprint before using on 4 GB).
ai_gateway_mempalace_embedding_model: "minilm"

# RapidPro Integration
ai_gateway_rapidpro_host: "http://localhost:8080"
ai_gateway_rapidpro_token: "{{ rapidpro_auth_token | default('change-me') }}"

# SiYuan Integration (used by talkmaster/jwlinker for notebook sync)
ai_gateway_siyuan_url: "http://localhost:6806"
ai_gateway_siyuan_token: "{{ siyuan_api_token | default('') }}"

# Optional admin contact (e.g. for debug webhooks)
ai_gateway_admin_phone: ""
ai_gateway_api_key: ""
ai_gateway_authorized_users: ""

# Cockpit deliverables (capture → weekly sitrep / month-end report drafts).
# Empty = the app's generic fallbacks; set the real labels in local_vars.yml.
ai_gateway_work_site: ""            # site/city shown on the drafts' From: line
ai_gateway_sitrep_recipient: ""     # who the weekly sitrep is addressed to
ai_gateway_sitrep_lang: ""          # sitrep draft language: "" / en (default) or fr
ai_gateway_cockpit_notebook: ""     # SiYuan notebook for Life docs (default: Life)
ai_gateway_travay_notebook: ""      # SiYuan notebook for work docs (default: 💼 Work)
ai_gateway_ministry_goal_hours: ""  # monthly ministry-hours goal → progress/pace in evening wrap
ai_gateway_secretary_reports: ""    # truthy → congregation-secretary month-end nudges

# RiveBot intent-matching service
ai_gateway_rivebot_url: "http://localhost:8087"

# Public URLs (for download links / SiYuan links sent to users via WhatsApp)
ai_gateway_public_url: "http://localhost:8086"
ai_gateway_siyuan_public_url: "{{ ai_gateway_siyuan_url }}"
ai_gateway_siyuan_notebook_id: ""

# jwlinker DB path — empty uses platform default (~/.local/share/jwlinker/jw_library.db)
# Shared corpus convention: /library/jwlinker/jw_library.db (see jwlinker-refresh)
ai_gateway_jwlinker_db_path: ""

# Knowledge-graph location pin (MEMPALACE_KG_PATH) — one canonical file so a
# service, a cron job, and an interactive shell never open different graphs.
mempalace_kg_path: "{{ ai_gateway_dir }}/.mempalace/knowledge_graph.sqlite3"

# Webhook endpoints injected into the gateway env
ai_gateway_webhook_url: "http://127.0.0.1:8086"
ai_gateway_rapidpro_webhook_host: "http://localhost"

# PostgreSQL URI for persona/channel/admin data (shares RapidPro's temba DB)
# The konex_* tables are auto-created on first boot via init_db().
# Set to "" to fall back to local SQLite (dev only).
ai_gateway_postgres_uri: "postgresql+asyncpg://{{ rapidpro_db_user | default('temba') }}:{{ rapidpro_db_pass | default('temba') }}@localhost:5432/{{ rapidpro_db_name | default('temba') }}"

# Fallback persona when no channel→persona mapping exists
ai_gateway_default_persona: "konex-support"

# Hermes runs in the gateway's process: these go into the service unit's environment.
ai_gateway_hermes_max_iterations: 15
ai_gateway_hermes_thread_pool_size: 2         # 2 on a 4 GB box; 3 on roomier ones
ai_gateway_hermes_home: "{{ ai_gateway_dir }}/data/hermes"

# MemPalace structured memory (ChromaDB backend)
ai_gateway_mempalace_palace_path: "{{ ai_gateway_dir }}/data/palace"
ai_gateway_mempalace_backend: "chromadb"

# SiYuan Knowledge Wiki integration (enable in Phase 4)
ai_gateway_siyuan_wiki_enabled: false
ai_gateway_siyuan_api_url: "http://localhost:6806"

# Contact directory line (docs/contact-sync.md). Both optional, set in
# local_vars.yml; empty keeps the assistant's own workspace and channel.
# API token of the directory workspace when the directory lives in its own
# RapidPro workspace; empty = same workspace as the assistant.
ai_gateway_contact_sync_rapidpro_token: ""
# UUID or number of the directory line's WhatsApp channel; contact cards are
# sent from it; empty = the assistant's channel.
ai_gateway_contact_sync_wuzapi_channel: ""

# Talk sync: Organized weekend schedule → talkmaster revisions (nightly 03:45).
# Set talk_sync_speaker in local_vars.yml (substring of the speaker's display
# name in Organized) to enable; without it the job aborts loudly.
talk_sync_language: "ht"
talk_sync_pub: "s34"

# The scheduled jobs of the gateway: one systemd service and timer each, rendered from the two
# templates ai-gateway-job.service.j2 and ai-gateway-job.timer.j2 (one entry here = one pair of
# units, ai-gateway-<name>.service and .timer). Fields: description, timer_description,
# on_calendar (a list; several entries = several OnCalendar lines), module (run as
# `python -m <module>` from the venv) or exec (the full ExecStart), and the optional
# documentation (the gateway's repository by default), after and wants (units beyond network.target).
ai_gateway_jobs:
  compact:
    description: Nightly MemPalace Compaction for AI Gateway
    documentation: https://github.com/deldesir/mempalace
    exec: |-
      /bin/bash -c 'n=0; until {{ ai_gateway_dir }}/.venv/bin/mempalace compress; do n=$$((n+1)); [ $$n -ge 5 ] && echo "compact: palace still locked after $$n attempts" && exit 1; echo "compact: palace busy, retry $$n/5 in 60s"; sleep 60; done'
    on_calendar:
      - '*-*-* 03:00:00'
    timer_description: Timer for Nightly MemPalace Compaction
  kgextract:
    description: Nightly drawer→KG fact extraction (MemPalace → knowledge graph)
    module: app.jobs.kg_extract
    on_calendar:
      - '*-*-* 03:15:00'
    timer_description: Timer for nightly drawer→KG extraction
  kgwiki:
    description: Nightly KG→Wiki render (MemPalace knowledge graph → SiYuan Wiki)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.kg_wiki_render
    on_calendar:
      - '*-*-* 03:30:00'
    timer_description: Timer for nightly KG→Wiki render
  nudge:
    description: Morning talk-prep nudge (actionable items → admin, email-first)
    after:
      - siyuan.service
    module: app.jobs.talk_nudge
    on_calendar:
      - '*-*-* 07:00:00 America/Port-au-Prince'
    timer_description: Timer for morning talk-prep nudge
  talksync:
    description: Nightly Organized→talkmaster assignment sync (auto-create talk revisions)
    after:
      - organized.service
      - siyuan.service
    wants:
      - organized.service
    module: app.jobs.talk_sync
    on_calendar:
      - '*-*-* 03:45:00'
    timer_description: Timer for nightly Organized→talkmaster assignment sync
  radar:
    description: Nightly cockpit radar (reality scan → SiYuan Radar + morning digest)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.cockpit_radar
    on_calendar:
      - '*-*-* 06:30:00 America/Port-au-Prince'
    timer_description: Timer for the morning cockpit radar (reality scan → SiYuan + digest)
  personsync:
    description: Nightly person-hub sync (Organized roster → RapidPro contacts + SiYuan pages)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.person_sync
    on_calendar:
      - '*-*-* 04:00:00'
    timer_description: Timer for nightly person-hub sync (Organized → RapidPro + SiYuan)
  dailybrief:
    description: Morning daily-note brief (near-horizon facts → machine block in today's daily note)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.daily_brief
    on_calendar:
      - '*-*-* 06:40:00 America/Port-au-Prince'
    timer_description: Timer for the morning daily-note brief (after the 06:30 radar)
  synthesis:
    description: Morning Hermes synthesis (insights from yesterday → machine block in today's daily note)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.daily_synthesis
    on_calendar:
      - '*-*-* 06:50:00 America/Port-au-Prince'
    timer_description: Timer for the morning Hermes synthesis (after the 06:40 brief)
  weekly:
    description: Sunday weekly review (scaffold + Hermes week synthesis → SiYuan Weekly Reviews)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.weekly_review
    on_calendar:
      - Sun *-*-* 18:00:00 America/Port-au-Prince
    timer_description: Timer for the Sunday weekly review synthesis
  eveningwrap:
    description: Evening wrap (day's captures → tomorrow's priorities + hard-stop cue in today's daily note)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.evening_wrap
    on_calendar:
      - '*-*-* 20:30:00 America/Port-au-Prince'
    timer_description: Timer for the evening wrap (~20:30, closes the day, seeds tomorrow)
  sitrep:
    description: Weekly sitrep draft (Friday — week's ticket/incident captures → draft in Work + nudge)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.weekly_sitrep
    on_calendar:
      - Fri *-*-* 16:00:00 America/Port-au-Prince
    timer_description: Timer for the weekly sitrep draft (Friday 16:00)
  monthend:
    description: 'Month-end pack (prev month: work report draft + pioneer hours total + secretary reminder)'
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.month_end
    on_calendar:
      - '*-*-01 08:00:00 America/Port-au-Prince'
    timer_description: Timer for the month-end pack (1st of month, 08:00, summarizes the previous month)
  reminders:
    description: Fire due operator reminders (captures.jsonl kind=reminder → admin nudge)
    module: app.jobs.reminders
    on_calendar:
      - '*:0/2:00'
    timer_description: Timer for firing due operator reminders (every 2 min)
  weekahead:
    description: Week-ahead chief-of-staff brief (Sunday — reasons over the coming week → SiYuan + nudge)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.week_ahead
    on_calendar:
      - Sun *-*-* 19:00:00 America/Port-au-Prince
    timer_description: Timer for the week-ahead chief-of-staff brief (Sunday 19:00)
  spiritual:
    description: Morning spiritual nudge (daily text + meeting prep + study rhythm → admin, WhatsApp)
    module: app.jobs.spiritual_nudge
    on_calendar:
      - '*-*-* 06:50:00 America/Port-au-Prince'
    timer_description: Timer for the morning spiritual nudge
  home:
    description: Cockpit Home — consolidate the cockpit into one always-rewritten SiYuan doc
    after:
      - siyuan.service
    module: app.jobs.cockpit_home
    on_calendar:
      - '*-*-* 06:45:00 America/Port-au-Prince'
      - '*-*-* 12:30:00 America/Port-au-Prince'
      - '*-*-* 18:30:00 America/Port-au-Prince'
    timer_description: Timer for the Cockpit Home refresh
  shepherd:
    description: 'Weekly shepherd nudge (field-group coverage: who you haven''t logged → admin, email)'
    module: app.jobs.shepherd_nudge
    on_calendar:
      - Sat *-*-* 08:00:00 America/Port-au-Prince
    timer_description: Timer for the weekly shepherd nudge (Saturday morning, before field service)
  siyuancapture:
    description: SiYuan inbound capture (poll ✍️ Inbox → captures.jsonl, loop-safe)
    after:
      - siyuan.service
    wants:
      - siyuan.service
    module: app.jobs.siyuan_capture
    on_calendar:
      - '*-*-* *:0/10:00'
    timer_description: Timer for SiYuan inbound capture (poll the ✍️ Inbox every 10 minutes)
  persontouches:
    description: Person touches (shepherd captures → 🕊️ Shepherd block on matched /people pages)
    after:
      - siyuan.service
      - ai-gateway-personsync.service
    wants:
      - siyuan.service
    module: app.jobs.person_touches
    on_calendar:
      - '*-*-* 04:30:00'
    timer_description: Timer for person touches (daily, after the nightly person sync)
  ldctwp:
    description: LDC TWP notifier (email each brother his training assignment, days before → operator review by default)
    module: app.jobs.ldc_twp_notify
    on_calendar:
      - '*-*-* 07:30:00 America/Port-au-Prince'
    timer_description: Timer for the LDC TWP assignment notifier (daily morning check of the lead window)
  ldcpeople:
    description: 'LDC people sync (a /people page per TWP volunteer: role rotation + contact + next assignment)'
    module: app.jobs.ldc_people_sync
    on_calendar:
      - '*-*-* 04:15:00'
    timer_description: Timer for the LDC people sync (daily, just after person sync)
  contactsync:
    description: Team contact notifier (send each team member new/changed contact cards → operator review by default)
    module: app.jobs.contact_sync_notify
    on_calendar:
      - '*-*-* 08:15:00 America/Port-au-Prince'
    timer_description: Timer for the team contact notifier (daily check for directory changes)
ai_gateway_maintenance_units:
  - pipeline-health-check
  - second-brain-backup
  - fleet-backup-mail
  - fleet-backup-mail-hub
# The units as the shared uv-service role installs them (roles/uv-service/README.md): a file
# name is a template rendered as itself; a mapping names the template, the unit and the job it
# is rendered for. The maintenance units are installed everywhere, their timers enabled here
# except the emailed fleet backups, which only the hub enables (tasks/install.yml).
ai_gateway_job_units: >-
  {%- set out = [] -%}
  {%- for name, job in ai_gateway_jobs.items() -%}
  {%- for kind in ['service', 'timer'] -%}
  {%- set _ = out.append({'src': 'ai-gateway-job.' ~ kind ~ '.j2', 'name': 'ai-gateway-' ~ name ~ '.' ~ kind, 'job': job | combine({'name': name})}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
ai_gateway_units: >-
  {{ ['ai-gateway.service.j2']
     + ai_gateway_job_units
     + (ai_gateway_maintenance_units | product(['.service.j2', '.timer.j2']) | map('join') | list) }}
ai_gateway_timers: >-
  {{ (ai_gateway_jobs | list | map('regex_replace', '^', 'ai-gateway-') | map('regex_replace', '$', '.timer') | list)
     + ['pipeline-health-check.timer', 'second-brain-backup.timer'] }}

ai_gateway_service:
  name: ai-gateway
  role: ai-gateway
  dir: "{{ ai_gateway_dir }}"
  user: "{{ ai_gateway_user }}"
  repo: "{{ ai_gateway_repo }}"
  version: "{{ ai_gateway_repo_version }}"
  libraries: "{{ ai_gateway_libraries }}"
  python: "{{ ai_gateway_python }}"
  env: ai-gateway.env.j2
  env_local: true
  units: "{{ ai_gateway_units }}"
  services: [ai-gateway]
  timers: "{{ ai_gateway_timers }}"
  enabled: "{{ ai_gateway_enabled }}"
