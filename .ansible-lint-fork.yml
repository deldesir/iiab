# ansible-lint configuration for the fork's own roles (the FORK_ROLES list in
# .github/workflows/fork-checks.yml). The workflow lints every task file of those roles by
# path: handing ansible-lint a role directory offline lints nothing (it counted one "file" per
# role and passed), which is how the step stayed green while hundreds of findings existed.
#
# Every skipped rule below is a backlog item with its sweep, not an opinion. Remove a rule from
# the list when its sweep is merged; the step then fails on any regression.
profile: production
skip_list:
  - role-name                     # IIAB role names (0-init, 1-prep, ai-update) predate the rule
  - var-naming[no-role-prefix]    # IIAB's variable names are an upstream convention shared with local_vars
  - no-changed-when               # eight Android/proot tasks left (#188, #192, #193 did the rest); removed when a device run can test them
  - no-handler                    # kept with its reason: ai-update sequences its restarts itself (#200); the handlers that could be handlers are
